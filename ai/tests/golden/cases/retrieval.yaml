# ============================================================
# 检索基准用例 — 无 LLM、秒级，每次改检索/知识库后必跑
# 入口：_retrieve_with_context（真实三路 + 精排 + 错误码保送全链路）
# 字段：
#   name:        用例名（报告展示）
#   query:       用户问句
#   expect_hit:  期望出现在送 prompt 资料里的标题关键词（任一命中即过）
#   rank_within: 可选，关键词所在资料的编号 ≤ 此值才算过（默认不限）
# 加用例：直接按格式追加，或 runner --add retrieval --query "…" --expect "关键词"
# ============================================================

- name: 错误码403精确保送
  query: 错误码403是什么问题
  expect_hit: ["车端错误码 403"]
  rank_within: 1

- name: 错误码813精确保送
  query: 我的AGV报错813，这是啥问题
  expect_hit: ["车端错误码 813"]
  rank_within: 1

- name: 型号XS1152不误判为错误码
  query: XS1152的IO口定义在哪里查
  expect_hit: ["IO 定义对照表"]
  rank_within: 3

- name: 货架前停住取不出货
  query: AGV到了货架前面就停住不动了，货也没取出来，日志里查什么
  # 0916 知识库扩充后检索重排：车端实施手册「卸货停在路上」排查节顶到第一
  expect_hit: ["卸货时，停在了路上"]

- name: 多车到同一点位偏差
  query: 多台AGV到同一个点位都有偏差，怎么校准一致
  expect_hit: ["多车一致性"]
  rank_within: 2

- name: 激光雷达安装偏移标定
  query: 激光雷达识别出来的位置和实际位置总是差一点，传感器的安装偏移在哪里标定
  expect_hit: ["ep_tf"]

- name: 车身尺寸与膨胀量在哪改
  query: 机器人的车身尺寸参数在哪改，怕膨胀量不够会撞到货架
  # 0916 重排观察项：华睿协议手册（讲货架腿宽高=膨胀量语义）顶到第一，
  # vehicleui参数（二）被挤出——检索噪声挤占，若持续退化需调域权重
  expect_hit: ["货架腿", "膨胀量"]

- name: 低电量自动充电阈值
  query: 机器人低电量到多少会自己回去充电，阈值在哪设
  # 0916 重排：低电量诊断卡（现象/影响/排查）顶到第一，比参数页更贴现象
  expect_hit: ["低电量不自动回充"]
  # 0904 域保底后从 MISS 救回 rank#3（0902 精排重接混域稀释实锤之一）；
  # 送 prompt 共 6 条，第 3 名对 LLM 可见，断言 2→3
  rank_within: 3

- name: 机器人型号版本号在哪改
  query: 机器人型号和软件版本号在配置里哪里改
  # 0916 重排：机器人类型配置手册章节命中
  expect_hit: ["机器人类型配置"]

- name: 列库存宽度参数
  query: 列库存那边的宽度参数在哪配置
  expect_hit: ["vehicleui参数（四）"]

- name: 运动控制日志在哪看
  query: 货叉动作不对，想去日志里看看，运动控制的日志在哪里看
  expect_hit: ["运动控制日志在哪看"]
  rank_within: 2

- name: 卡车装车扫描流程
  query: 卡车装车扫描的流程怎么编排，扫描完卡车上的库位怎么生成
  expect_hit: ["流程编排：装车扫描流程", "动态地图生成参数"]

- name: 雷达外参标定内容
  query: 车端雷达外参标定具体要标哪些东西，标完写到哪里
  expect_hit: ["雷达外参标定"]
  rank_within: 2

# 0904 事故复刻：上线流程类 query 正确章节必须完整进 prompt（800 截断时期被砍尾）
- name: 自研XNA上线命中自研车上线章节
  query: 自研XNA如何上线调度
  expect_hit: ["自研车上线"]
  rank_within: 4

- name: RXX上线命中RXX车上线章节
  query: rxx潜伏车怎么上线
  expect_hit: ["RXX车上线"]
  rank_within: 4

# ── 0916 知识库扩充回归：车型目录 17 例 + 算法原理 43 篇 + 沉淀卡 ──
- name: 车型目录-XFC001数智飞仓
  query: XFC001是什么车
  expect_hit: ["XFC001"]
  rank_within: 3

- name: 算法原理-多车路径规划
  query: 多车路径规划有哪几种方式
  expect_hit: ["多车路径规划"]
  rank_within: 5

- name: 症状词-绕远路命中算法/锁区文档
  query: 车规划绕远路是什么原因
  expect_hit: ["路径规划", "锁区", "库位"]
  rank_within: 8

- name: 沉淀卡-休息节点编排
  query: 流程模板找不到休息节点怎么编排
  expect_hit: ["休息节点"]
  rank_within: 6
