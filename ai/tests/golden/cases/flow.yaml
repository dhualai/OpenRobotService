# ============================================================
# 待补充信息询问与项目引导基准用例 — 真实 LLM 多轮
# 入口：_agent_think_stream 多轮驱动
# 铁律（项目永不拦截）：任何场景话术不得出现项目必填类措辞——
#   项目必选唯一入口是弹窗，对话里出现拦截话术即回归
# 字段：
#   name / turns / expect_ask_any / forbid_any / strict 同 ticket.yaml
# ============================================================

- name: 项目永不拦截铁律
  turns:
    - 帮我提个工单，车坏了走不了
  forbid_any: ["必须选择项目", "项目是必填", "先选择项目", "项目不能为空", "必须先选项目"]
  strict: true

- name: 项目引导编号选题
  turns:
    - 帮我提个工单，项目是中力的那个仓库项目
  forbid_any: ["必须选择项目", "项目是必填", "先选择项目", "项目不能为空", "必须先选项目"]

- name: 先聊故障再咨询不误提单
  turns:
    - 我们车报错813了
    - 这个错误码是什么意思
  forbid_any: ["必须选择项目", "项目是必填", "先选择项目", "项目不能为空", "必须先选项目"]

# ── 线上一键回归补充（dar_regress；本地 runner 跳过以下 expect_stages 等线上字段） ──
- name: 项目引导按钮题面输出
  turns:
    - 帮我提个工单，我们一台XQE车报错813停在货架前取不了货，车编号A027
    - 今天上午的事，货架在A区03库位，反复出现
  # 选题话术服务端模板直出（不走 LLM），「点击下方按钮」是前端渲染按钮的
  # 锚点——话术含它 = 项目引导输出正常且按钮锚点在
  expect_ask_any: ["点击下方按钮", "出单前确认一下关联项目"]
  # 0916 降非 strict：flash 对信息完备的提单偶发漏判 ticket_intent（走成
  # 先问字段），此时弹窗必选项目兜底、铁律未破——波动 WARN 提示人工看
  strict: false

- name: 诊断轮走工具循环阶段
  turns:
    - 货叉取货的时候动作不对，想查下日志，运动控制的日志在哪里看
  expect_stages_any: ["diagnosing", "retrieving", "answering"]

# ── 工具路由断言（0909 补）：expect_tools_* 从服务端 [plan] 规划日志读实际
# 调用的工具（合并全轮集合）——组合问法测的就是规划器路由对不对 ──
#   expect_tools_any:  任一调了即过；expect_tools_all: 列出的必须都调
#   forbid_tools:      列出的一个都不许调
# post_asks 项内也可写 expect_tools_all / forbid_tools（轮级断言：只看该轮
# 之后的规划行，锚=追问文本；全会话断言会误伤前几轮的合法调用）
# 可用工具名：search_kb / lookup_ticket / search_history_tickets / list_user_projects

- name: 项目查询-名下清单
  turns:
    - 我名下关联的项目都有哪些
  expect_tools_all: [list_user_projects]
  strict: true

- name: 故障问原因-手册与实战双检索
  turns:
    - 我们一台XQE车报错813停在货架前取不了货，是什么原因，怎么解决
  expect_tools_all: [search_kb, search_history_tickets]
  strict: true

- name: 故障带项目名-不误调项目查询
  turns:
    - 中力项目的车报813故障，怎么处理
  expect_tools_any: [search_kb]
  forbid_tools: [list_user_projects]
  strict: true

- name: 纯问候-不调任何资料工具
  turns:
    - 你好，在吗
  forbid_tools: [search_kb, lookup_ticket, search_history_tickets, list_user_projects]

- name: 多轮工具切换-从故障检索到项目查询
  turns:
    - 我们车报错813了，该怎么办
    - 对了，顺便问下我名下有哪些项目
  expect_tools_all: [search_kb, list_user_projects]
  strict: true

# ── 查单链路（动态工单号：静态号在测试库会被清/换人不可靠）──
# 提单落库拿自己的 {db_id}，{other_id} 动态查一张别人的单做权限反例
- name: 查单全链路-自己的单透内容别人的单拒查
  turns:
    - 帮我提个工单，我们一台XQE车报错813停在货架前取不了货，车编号A027
    - 今天上午的事，货架在A区03库位，反复出现
  followup_pool:
    - when: 关联项目
      say: "1"
  expect_review_any_round: true
  expect_confirm: true
  expect_db: true
  expect_tools_all: [lookup_ticket]
  post_asks:
    - ask: "{db_id}号工单现在处理得怎么样了"
      expect_any: ["状态", "处理", "受理", "流转", "待处理", "进行中"]
    - ask: "{other_id}号工单现在处理得怎么样了"
      expect_any: ["权限", "无关", "不能查看", "无法查看", "不开放", "看不到", "查不到", "没有关联"]
      forbid_any: ["已解决", "工程师正在", "处理中"]
  strict: true

- name: 查单后引用再提单-查单但不检索
  turns:
    - 帮我提个工单，XQE车报813取不了货，车编号A027
    - 今天上午十点的事，A区03库位，反复出现
  followup_pool:
    - when: 关联项目
      say: "1"
  expect_review_any_round: true
  expect_confirm: true
  post_asks:
    - ask: "针对{db_id}号工单的问题再帮我提一单，还是这台车"
      expect_any: ["工单", "单据", "草稿", "确认"]
      # 轮级断言：再提单这轮应引用已有工单（lookup）而非重新检索（search_kb
      # 第一轮提单调它是设计行为，禁调只对再提单轮成立）
      expect_tools_all: [lookup_ticket]
      forbid_tools: [search_kb]
  strict: true

# ── 0916 持久化：原 verify_* 手跑脚本的历史事故回归（tests/manual/ 可查原始脚本）──
- name: 诊断轮换新话题-检索词不残留（0904事故回归）
  turns:
    - 我们车一直报错813怎么办
    - 明白了。那库位长度和货架宽度分别在哪里配置
  # 第 2 轮换了全新话题：回答必须围绕新话题，不得被旧话题残留检索词顶掉
  post_asks:
    - ask: "那库位长度具体在哪里改"
      expect_any: ["库位", "配置", "参数", "编辑"]
      forbid_any: ["813", "报错813"]
  strict: true

- name: 谈论提单话题不误触提单（谈论≠要求）
  turns:
    - 你们这个工单提交之后一般是怎么流转的
    - 那工程师接到单子之后会做什么
  # 只是了解流程，不是要提单：不得出提单弹窗锚点/项目引导/确认话术
  forbid_any: ["点击下方按钮", "出单前确认一下关联项目", "生成工单草稿"]
  strict: false

# ── 0916 853/855 回归：答编号定序 + 越界拦截 + 摇人吧提及预填 ──
- name: 项目引导答序号-预填列表对应项目（855回归）
  turns:
    - 帮我提个工单，XQE车报错813停在货架前取不了货，车编号A027
    - "1"
  # 答序号「1」→ 服务端定序预填候选第 1 项，LLM 不得幻觉照抄其他项目
  expect_review_any_round: true
  followup_pool:
    - when: 时间
      say: 今天上午十点左右开始的
    - when: 位置
      say: A区03库位那边
  strict: true

- name: 越界序号不预填列表外项目（855回归）
  turns:
    - 帮我提个工单，XQE车报错813停在货架前取不了货，车编号A027
    - "7"
  # 「7」超出候选数量：服务端置空 choice，弹窗必选兜底，绝不预填列表外项目
  expect_review_any_round: true
  forbid_any: ["项目已预填为"]
  followup_pool:
    - when: 时间
      say: 今天上午十点
  strict: true

- name: 提及摇人吧界面-提单直接预填不重复出题（853回归）
  turns:
    - 摇人界面ai回复，需要支持部分复制
    - 帮我提个工单，就是这个界面的问题
    - 想复制AI回复里的故障描述部分，现在只能整条复制
  # 「摇人界面」= 指称摇人吧服务号项目（0916 放开平台名豁免）：提单时
  # 直接预填弹窗，不得重复出项目题
  expect_review_any_round: true
  forbid_ask_any: ["出单前确认一下关联项目"]
  followup_pool:
    - when: 时间
      say: 今天上午开始的
    - when: 复制
      say: 就想复制回复里的故障描述那段
  strict: true
