# 风险推算评分配置（确定性规则引擎）
#
# 风险口径改造：风险分析不再读取 risk 表（人工登记），改为按规则从
# 项目信息与工单数据综合推算每个项目的风险分数与等级：
#   信号输入（每项目）：
#     - 未关闭工单数 / 近30天新增工单数（报障、Bug 类工单按 problem_factor 加权）
#     - AGV 数量（车型信息 > 总车数，缺失时回退车型数量之和）
#     - AGV 种类（车型1/车型2 中数量 > 0 的车型数）
#     - 项目类型（基础信息 > 项目类型节点）
#     - 人工风险点（项目特性 > 风险点节点）
#   输出：分数（0~100）、等级（低/中/高）、风险因素清单。
#
# 调参只改本文件，无需动代码。修改后重启 AI 服务生效。

# 等级阈值：分数 <= low_max 为低风险，>= high_min 为高风险，中间为中风险
levels:
  low_max: 40
  high_min: 70

# 工单因子
ticket:
  open_weight: 4        # 每条未关闭工单加分
  open_cap: 40          # 未关闭工单单项得分封顶
  new_30d_weight: 6     # 近30天每条新增工单加分
  new_30d_cap: 30       # 近30天新增单项得分封顶
  problem_factor: 1.5   # 报障/bug 类工单加权系数

# AGV 因子
agv:
  scale_weight: 1       # 每台 AGV 加分
  scale_cap: 15         # AGV 规模单项得分封顶
  multi_model_bonus: 8  # 车型种类 > 1 的额外加分（多车型混跑集成风险）

# 项目类型底分（「基础信息 > 项目类型」节点值；未命中记 0 分）
project_type_scores:
  受关注项目: 15
  大客户项目: 10
  展会/演示项目: 0
  展厅项目: 0
  PK项目: 25
  试点项目: 20
  试用项目: 10
  内部/测试项目: 0

# 人工风险点底分（「项目特性 > 风险点」节点值；未命中记 0 分）
manual_risk_scores:
  数据同步错误: 20
  公司评审不通过: 30
  缺前置承接: 25
  高风险承接: 40
  中风险承接: 20
  低风险承接: 5
