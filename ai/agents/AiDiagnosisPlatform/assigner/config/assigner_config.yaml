  工单系统: [后端, 业务系统]
  在线文档: [后端, 文档系统]
  微信服务号: [前端, 后端, 微信]
  调度: [后端, 任务调度, 算法]
  算法: [算法, 路径规划]
  地图编辑: [前端, 地图编辑]
  运行监控: [前端, 后端]
  仿真管理: [后端, 仿真]
  库位管理: [后端, 库位]
  外设管理: [后端, 外设]
  任务管理: [后端, 任务调度]
