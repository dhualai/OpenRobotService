# ==========================
# 2. 类别到责任模块映射
#    用于从历史任务类别推断责任模块
# ==========================
category_module_map:
  用户帮助中心: [前端, 文档系统]
  产品知识问答: [算法, AI, 后端]
  AI售前: [算法, AI]
  AI闭环系统: [算法, AI]
  工单系统: [后端, 业务系统]
  在线文档: [后端, 文档系统]
  微信服务号: [前端, 后端, 微信]
  调度: [后端, 任务调度, 算法]
  算法: [算法, 路径规划]
  地图编辑: [前端, 地图编辑]
  运行监控: [前端, 后端]
  仿真管理: [后端, 仿真]
  库位管理: [后端, 库位]
  外设管理: [后端, 外设]
  任务管理: [后端, 任务调度]
  车辆管理: [后端, 车端]
  数据: [数据, 后端]
  多语言: [前端, 后端]
  项目对接: [后端, 车端]
  适配层开发: [后端, 车端]

# ==========================
# 3. 精排评分权重
#    所有权重之和应为 1.0
# ==========================
ranker_weights:
  module_match: 0.40
  history_match: 0.35
  semantic_match: 0.25

# 职级惩罚系数
#   职级越高越不优先接单，但不过滤——该部门没有低职级时，高职级也能被派到。
#   数字 = 对该职级的最终分数乘数
#   "99" = 未知职级的默认惩罚
job_level_penalty:
  1: 1.0
  2: 0.60
  3: 0.40
  99: 0.60

# 置信度阈值
decision_thresholds:
  auto: 0.8
  recommend: 0.5
