  适配层开发: [后端, 车端]

# ==========================
# 3. 精排评分权重
# ==========================
ranker_weights:
  module_match: 0.40
  history_match: 0.35
  semantic_match: 0.25

# ==========================
# 4. 职级惩罚系数
# ==========================
job_level_penalty:
  1: 1.0
  2: 0.60
  3: 0.40
  99: 0.60

# ==========================
# 5. 部门责任范围（硬过滤——跨部门不互抢）
# ==========================
# 匹配顺序: 机器人事业部 → 车端软件 → 智能规划(兜底)
# department_scopes:
#   <部门名>:
#     keywords: [关键词列表]
#     products: [产品列表（该部门下的产品key）]
department_scopes:
  机器人事业部:
    keywords: [机器人, AGV本体, 车体, 机器人管理, 机器人控制, 机器人产品, 机器人交付]
    products: [机器人]
  车端软件:
    keywords: [车端软件, 网关, 控制器, 定位算法, 感知算法, 底层系统, 嵌入式, 传感器融合, 驱动开发, 车载, 车载网关, 定位偏差, 传感器故障]
    products: [车端软件]
  智能规划:
    keywords: [调度, USP, 服务号, 地图编辑, 路径规划, 外设, 库位, 任务分配, 任务调度, 前端, 后端, 测试, 数据分析, 部署运维, 微信, 工单, 智能问答, AI, 算法, 充电, 休息, 网络, 仿真, 流程编排, 多语言, License, 禅道, VDA5050, MQTT, 科钛, 睿芯行, 华睿, 车端对接, 机器人管理]
    products: [调度USP, 服务号]

