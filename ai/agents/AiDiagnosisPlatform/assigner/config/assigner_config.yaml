# ==========================
# 2. 三路召回权重
# ==========================
# L1 纯LLM: LLM 看全员画像直接打分
# L3 语义:   Embedding 画像余弦相似度
# L4 历史:   Embedding 历史工单 → 按 engineer_id 聚合（与L3共享调用,权重低,数据积累中）
ranker_weights:
  llm_match: 0.50
  module_match: 0.00
  semantic_match: 0.40
  history_match: 0.10

# ==========================
# 3. 职级惩罚系数
# ==========================
job_level_penalty:
  1: 1.0
  2: 0.60
  3: 0.40
  99: 0.60

# ==========================
# 4. 部门过滤（极保守）
# ==========================
department_scopes:
  智能规划:
    keywords: [服务号, 微信, 我要摇人, 工单系统, 智能问答]

# 置信度阈值
decision_thresholds:
  auto: 0.8
  recommend: 0.5
