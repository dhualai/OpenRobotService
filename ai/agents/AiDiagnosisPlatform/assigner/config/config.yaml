# ══════════════════════════════════════════════════════════════════
# Assigner 派单配置
#
# 说明：本文件是派单模块唯一的配置入口，由 settings.py 加载。
# 各配置块与代码的对应关系：
#   module_keywords      → recall/history_recall.py（L3 历史召回：历史工单标签提取）
#   module_anchor_texts  → recall/semantic_recall.py（L2 语义召回：Embedding 锚文本）
#   ranker_weights       → ranking/ranker.py（三路召回加权）
#   history_recall       → recall/history_recall.py（L3 历史召回增强：时间衰减 + Top-K + 故障码）
#   job_level_penalty    → ranking/ranker.py（职级折扣）
#   department_routing   → filtering/dept_router.py
#   departments          → filtering/signals/llm_dept_signal.py
#   product_routing      → filtering/product_router.py
#   decision_thresholds  → ranking/fallback_decision.py（兜底置信度阈值）
#   load_balance         → pipeline/dispatch_flow.py（算法工程师负载均衡）
# ══════════════════════════════════════════════════════════════════

# ══════════════════════════════════════════════════════════════════
# 2. 精排权重（LLM 主导 + 语义辅助 + 历史辅助）
#    消费方：ranking/ranker.py（三路召回加权）
#    说明：L2 语义召回是真正的 Embedding 向量相似度匹配（cos(工单, 模块锚文本)），
#          非关键词子串匹配。当初误诊为"关键词匹配"而停用，实为 config 缺失
#          ranker_weights 导致权重退化（默认语义 0.35 > LLM 0.30 语义反超 LLM）所致。
#          现恢复为 LLM 主导(t链路) + L2 语义辅助 + L3 历史辅助：权重相加见下。
# ══════════════════════════════════════════════════════════════════
ranker_weights:
  llm_match: 0.70       # L1 纯LLM：LLM 看全员画像直接打分（主导派单）
  semantic_match: 0.15  # L2 语义：Embedding 向量相似度（辅助信号，不反超 LLM）
  history_match: 0.15   # L3 历史：相似历史工单 → 按解决人聚合

# ══════════════════════════════════════════════════════════════════
# 3.2 L3 历史召回增强参数（双路并行）
#    消费方：recall/history_recall.py（A路）+ recall/expertise_recall.py（B路）
#    - top_k:             每人取最高的前 K 条历史记录参与聚合（A路）
#    - half_life_days:    时间衰减半衰期（天），越大历史越不易被遗忘（A/B 共用）
#    - sim_threshold:     历史工单相似度阈值（A路）
#    - fault_code_boost:  历史同故障码的加分（A路）
#    - robot_type_boost:  历史同车型的加分（A路）
#    - decay_weight:      时间衰减在最终分中的占比（剩余部分给相似度）
#    - weight_a:          A路（相似工单聚人）融合权重
#    - weight_b:          B路（问题域聚人）融合权重
# ══════════════════════════════════════════════════════════════════
history_recall:
  top_k: 5
  half_life_days: 90        # 半衰期90天：90天后经验仍保留 ~37%，半年后仍保留 ~14%
  sim_threshold: 0.3
  fault_code_boost: 0.15
  robot_type_boost: 0.10
  decay_weight: 0.5
  weight_a: 0.5             # A路（相似工单聚人）
  weight_b: 0.5             # B路（问题域聚人）

# ══════════════════════════════════════════════════════════════════
# 4. 职级惩罚系数
#    用途：职级越高越不优先接单，精排后按职级打折。
#    消费方：ranking/ranker.py
# ══════════════════════════════════════════════════════════════════
job_level_penalty:
  1: 1.0     # 一线：不打折
  2: 0.60    # 管理/审核：打 6 折
  3: 0.40    # 仅兜底：打 4 折
  99: 0.60   # 未知职级兜底值

# ══════════════════════════════════════════════════════════════════
# 5. 部门路由（Layer 1：R2 LLM + R3 历史 融合 + R-Audit 审查）
#    消费方：filtering/dept_router.py
#    策略：保证"不派错部门"——R2 LLM 为主判、R3 历史为佐证。仅当部门判定足够确信才
#          hard_filter 收紧候选；中等信度 soft_prior 倾向；低信度 no_filter 保留全量。
#   融合：
#     - 原则：LLM(R2) 为基础分（不打折）；历史(R3) 只做"可加佐证"，不做惩罚。
#     - history_confirm_threshold: 该部门历史占比达到此值才视为"历史明确偏向"（佐证生效）。
#     - history_bonus:    历史明确偏向该部门（占比 ≥ history_confirm_threshold）时加的分（佐证确认）。
#     - 历史不足/缺失（占比 < threshold 或 hist=0）→ 不加不减，final = LLM 分，不打折。
#   阈值：
#     - hard_filter_score: 融合分达到此值且 margin 明显领先才收紧（R2 强确认 0.9+ 时可达到）。
#     - hard_filter_margin: 第一名与第二名的差距门槛，避免"接近并列"还被硬框。
#     - soft_prior_score: 中等信度 → 倾向该部门但不强制（精排给该部门加分）。
#    说明：R5 强关键词已移除（子串匹配易误触），R-Audit 独立复核兜底（dept_audit_enabled=true）。
# ══════════════════════════════════════════════════════════════════
department_routing:
  fusion:
    history_confirm_threshold: 0.5  # 该部门历史占比达到此值才视为"历史明确偏向"（佐证加分）
    history_bonus: 0.05             # 历史明确偏向时加的分（佐证确认）
                                    # 注：历史缺失/不足以确认时，LLM 为基础分不打折、不加不减
  thresholds:
    hard_filter_score: 0.63
    hard_filter_margin: 0.10
    soft_prior_score: 0.55
    dept_boost: 1.5
  llm:
    enabled: true
    # max_tokens 需容纳最多 3 个部门 + reason
    max_tokens: 320
    temperature: 0
    # min_confidence：R2 输出 confidence 的保留下限。配合 R2 prompt 四档刻度，
    # 主判(0.85+)与主要候选(0.55+)均可过；次要候选(0.25~0.55)也保留，供融合/收紧权衡。
    min_confidence: 0.3
  history:
    enabled: true
    top_k: 10
    min_similarity: 0.70

# R-Audit 部门派发审查开关（true = R2 判完部门后独立 LLM 单轮复核）
dept_audit_enabled: true

departments:
  - id: robot_hardware
    name: 机器人事业部
    profile_text: |
      【负责】车体硬件、机械结构、电池/电机/底盘、货叉/升降等行走与执行机构故障。
      【不负责】调度系统、路径规划、SLAM/定位、服务号软件、地图编辑。
      【典型现象】无法开机、充不进电、轮子脱落/卡死、车体碰撞变形、货叉不动。
    examples:
      - title: "AGV左前轮脱落，车体底部碰撞变形"
        dept: 机器人事业部
      - title: "电池充不进电，开机无反应"
        dept: 机器人事业部

  - id: vehicle_software
    name: 智能移动研究院
    profile_text: |
      【负责】车载软件、SLAM/定位、激光雷达/传感器、控制器、网关通信、底层驱动。
      【不负责】车体机械硬件、调度任务下发、服务号平台、地图路网编辑。
      【典型现象】定位漂移、重定位失败、雷达无数据、传感器报错、控制无响应。
    examples:
      - title: "车辆定位漂移，显示位置与实际偏差大"
        dept: 智能移动研究院

  - id: dispatch_planning
    name: 智能规划研究院
    profile_text: |
      【负责】调度USP、任务调度/下发/阻塞、路径规划/避让/锁区、地图编辑、
              摇人吧服务号平台（前端/后端/AI/后台管理）。
      【不负责】车体机械、车载 SLAM/传感器驱动、纯硬件故障。
      【典型现象】任务无法下发、路径规划失败、地图保存失败、服务号功能异常。
    examples:
      - title: "调度任务一直处于阻塞状态，无法下发"
        dept: 智能规划研究院

# R1 确定性规则（预留，有 evidence 后扩展）
department_rules: {}

# ══════════════════════════════════════════════════════════════════
# 6. 产品收紧（Layer 2）
#    消费方：filtering/product_router.py
# ══════════════════════════════════════════════════════════════════
product_routing:
  projects:
    - markers: ["摇人吧服务号"]
      product: 摇人吧服务号
  # 部门→产品映射：车端类工单（无项目标记时）按部门落到对应产品，避免误入默认「调度USP」。
  # 推断优先级：项目标记(projects) > 部门映射(dept_to_product) > 默认(default_product)。
  # 注：此映射曾于 2026-08-24 实现并验证后遗漏于配置，此处补回。
  dept_to_product:
    智能移动研究院: 车端软件
    机器人事业部: 车端硬件
  default_product: 调度USP
  default_when_project_set: true
  # users.responsibility_modules 中的 key 可能与 config 产品名不一致
  profile_keys:
    摇人吧服务号: ["摇人吧服务号", "服务号"]
    调度USP: ["调度USP"]
    车端软件: ["车端软件"]
    车端硬件: ["车端硬件"]

# ══════════════════════════════════════════════════════════════════
# 7. 置信度阈值（规则兜底决策用）
#    消费方：ranking/fallback_decision.py
#    auto ≥ 0.8 直接派单；recommend 0.5~0.8 建议确认；< 0.5 fallback
# ══════════════════════════════════════════════════════════════════
decision_thresholds:
  auto: 0.8
  recommend: 0.5

# ══════════════════════════════════════════════════════════════════
# 9. 负载均衡（已移除，enabled=false）
#    背景：按在途工单数打折，会把"唯一该承接者"（如产品经理）压出决策窗口，
#          导致 feature 需求等本应派给专门角色的工单派错。已从派单流程中移除。
#    保留配置项仅为可逆标记，启用后 dispatch_flow._apply_load_balance 会重新生效。
#    消费方：pipeline/dispatch_flow.py
# ══════════════════════════════════════════════════════════════════
load_balance:
  enabled: false
  step: 0.15

# ══════════════════════════════════════════════════════════════════
# 10. LLM 最终决策（Step 6）
#    消费方：ranking/llm_decision.py
#    规则：Step6 的 LLM 是『最终拍板决策者』，所有工单都进入 LLM 在精排 Top-K 窗口内
#          做最终决策（不再有"高分直接拍板/确定性分支"）。精排 #1 是默认最强依据，
#          但 LLM 有权在有实质理由（如用户重派、模块明显不匹配）时改选。
#    - llm_decision_topk：LLM 的候选窗口 = 精排前 K 名（default 3）
#    - yaorenba_force_module_owner：摇人吧服务号项目是否识别"模块总负责人"作为
#      额外决策线索喂给 LLM（default true；仅线索，非强制）
#    - llm_decision_low_score_threshold：保留仅为兼容日志展示，不再作为"触发 LLM"的门槛
# ══════════════════════════════════════════════════════════════════
llm_decision_low_score_threshold: 0.6
llm_decision_topk: 3
yaorenba_force_module_owner: true

# ══════════════════════════════════════════════════════════════════
# 11. L2 语义召回开关
#    消费方：pipeline/dispatch_flow.py（Step 3）
#    说明：true = 启用 L2 Embedding 向量语义召回（cos(工单, 模块锚文本)）。
#          L2 是真正的语义匹配（非关键词子串匹配），当初因误判为关键词而停用，
#          实为 ranker_weights 权重退化（语义 0.35 反超 LLM 0.30）所致。
#          现已把 semantic_match 权重收敛为辅助值(0.15 < llm 0.70)，LLM 保持主导。
# ══════════════════════════════════════════════════════════════════
semantic_recall_enabled: true
