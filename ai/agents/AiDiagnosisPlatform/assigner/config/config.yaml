# ══════════════════════════════════════════════════════════════════
# Assigner 派单配置
#
# 说明：本文件是派单模块唯一的配置入口，由 settings.py 加载。
# 各配置块与代码的对应关系：
#   module_keywords      → recall/history_recall.py（L3 历史召回：历史工单标签提取）
#   module_anchor_texts  → recall/semantic_recall.py（L2 语义召回：Embedding 锚文本）
#   ranker_weights       → ranking/ranker.py（三路召回加权）
#   history_recall       → recall/history_recall.py（L3 历史召回增强：时间衰减 + Top-K + 故障码）
#   job_level_penalty    → ranking/ranker.py（职级折扣）
#   department_keywords  → filtering/department_filter.py（部门过滤关键词：strong/medium/weak 三级）
#   department_scenes    → filtering/department_filter.py（部门故障场景库，embedding 语义补漏）
#   department_filter    → filtering/department_filter.py（部门过滤参数，如 embedding 阈值）
#   decision_thresholds  → ranking/fallback_decision.py（兜底置信度阈值）
#   load_balance         → pipeline/dispatch_flow.py（算法工程师负载均衡）
# ══════════════════════════════════════════════════════════════════

