      - 电机不转
      - 电机故障
      - 电机烧了
      - 轮子坏了
      - 轮子卡死
      - 轮子脱落
      - 车体损坏
      - 车体变形
      - 车体碰撞
      - 硬件损坏
      - 底盘故障
      - 底盘变形
