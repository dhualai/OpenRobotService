# ══════════════════════════════════════════════════════════════════
# 6. 部门故障场景库（embedding 语义补漏用）
#     用途：关键词未命中时，用工单文本 embedding 匹配各场景描述，
#           命中阈值 ≥0.65 则归入对应部门。
#     消费方：filtering/department_filter.py
# ══════════════════════════════════════════════════════════════════
department_scenes:
  机器人事业部:
    电源启动问题: "机器人无法开机、无法启动、无法上电，按键无反应，电源异常，设备没有任何动作"
    电池问题: "机器人电池异常，无法充电，电量下降过快，充电失败，电池损坏"
    电机驱动问题: "机器人电机不转，电机异响，驱动轮不动，行走电机故障"
    轮子底盘问题: "机器人轮子脱落、卡死，底盘变形，车体损坏，行走机构异常"
    机械结构问题: "机械臂不动，货叉卡住，升降机构异常，传送带故障"
  车端软件:
    定位感知问题: "机器人定位异常，定位漂移，定位不准，车辆跑偏，位置和实际不一致，激光雷达异常，传感器数据异常，SLAM失败，重定位失败"
    控制驱动问题: "控制器异常，车辆控制失效，运动控制出错，底盘控制无响应"
    通信网关问题: "车载网关通信异常，传感器数据不上报，控制器连接断开"
  智能规划:
    任务调度问题: "机器人任务无法执行，调度失败，任务无法下发，任务阻塞，任务分配异常"
    路径规划问题: "路径规划失败，机器人不会避让，锁区无法通行，交通管制异常"
    地图编辑问题: "地图编辑失败，路网异常，背景图加载失败，地图预处理出错，地图数据不对，编辑地图保存失败"
    平台系统问题: "服务号无法使用，微信功能异常，后台管理报错，数据看板加载失败"

# ══════════════════════════════════════════════════════════════════
# 7. 部门过滤参数
#     用途：部门过滤 embedding 语义补漏的匹配阈值。
#           embedding 分数 ≥ embed_threshold 才归入对应部门；
#           否则不过滤（保留全部候选，交给后续召回+LLM 决策选人）。
#     消费方：filtering/department_filter.py
# ══════════════════════════════════════════════════════════════════
department_filter:
  embed_threshold: 0.65

# ══════════════════════════════════════════════════════════════════
# 8. 置信度阈值（规则兜底决策用）
#    消费方：ranking/fallback_decision.py
#    auto ≥ 0.8 直接派单；recommend 0.5~0.8 建议确认；< 0.5 fallback
# ══════════════════════════════════════════════════════════════════
decision_thresholds:
  auto: 0.8
  recommend: 0.5

# ══════════════════════════════════════════════════════════════════
# 9. 负载均衡（仅对算法工程师生效，其余候选人不受影响）
#    用途：按在途工单数对算法工程师精排分数打折，在途越多系数越低，
#          避免单子集中在少数人（如原"主力"徐浩南）。
#    消费方：pipeline/dispatch_flow.py
#    负载系数 = 1 / (1 + 在途数 × step)
# ══════════════════════════════════════════════════════════════════
load_balance:
  enabled: true
  step: 0.15
  algorithm_engineers:
    - 徐浩南
    - 贾爽
    - 胡健楠
    - 吴彦清
    - 夏泽龙
