# ══════════════════════════════════════════════════════════════════
# Assigner 派单配置
#
# 说明：本文件是派单模块唯一的配置入口，由 settings.py 加载。
# 各配置块与代码的对应关系：
#   module_keywords      → recall/history_recall.py（L3 历史召回：历史工单标签提取）
#   module_anchor_texts  → recall/semantic_recall.py（L2 语义召回：Embedding 锚文本）
#   ranker_weights       → ranking/ranker.py（三路召回加权）
#   history_recall       → recall/history_recall.py（L3 历史召回增强：时间衰减 + Top-K + 故障码）
#   job_level_penalty    → ranking/ranker.py（职级折扣）
#   department_keywords  → filtering/dept_router.py（R5 strong 关键词）
#   department_routing   → filtering/dept_router.py
#   departments          → filtering/signals/llm_dept_signal.py
#   product_routing      → filtering/product_router.py
#   decision_thresholds  → ranking/fallback_decision.py（兜底置信度阈值）
#   load_balance         → pipeline/dispatch_flow.py（算法工程师负载均衡）
# ══════════════════════════════════════════════════════════════════

# ══════════════════════════════════════════════════════════════════
# 2. 精排权重（只保留 LLM + 历史两路；L2 锚文本语义已关闭）
#    消费方：ranking/ranker.py（三路召回加权）
#    说明：L2 锚文本/关键词匹配对"负责非功能模块"的候选人（如产品经理）结构化不公平，
#          且在有 LLM 强语义判断下反而干扰（表面字眼误导）。
#          semantic_match 置 0 = 语义分不参与精排，只看 LLM + 历史。
# ══════════════════════════════════════════════════════════════════
ranker_weights:
  llm_match: 0.85       # L1 纯LLM：LLM 看全员画像直接打分（主导派单）
  semantic_match: 0.0   # L2 语义：停用（有 LLM 后锚文本匹配是干扰）
  history_match: 0.15   # L3 历史：相似历史工单 → 按解决人聚合

# ══════════════════════════════════════════════════════════════════
# 3.2 L3 历史召回增强参数（双路并行）
#    消费方：recall/history_recall.py（A路）+ recall/expertise_recall.py（B路）
#    - top_k:             每人取最高的前 K 条历史记录参与聚合（A路）
#    - half_life_days:    时间衰减半衰期（天），越大历史越不易被遗忘（A/B 共用）
#    - sim_threshold:     历史工单相似度阈值（A路）
#    - fault_code_boost:  历史同故障码的加分（A路）
#    - robot_type_boost:  历史同车型的加分（A路）
#    - decay_weight:      时间衰减在最终分中的占比（剩余部分给相似度）
#    - weight_a:          A路（相似工单聚人）融合权重
#    - weight_b:          B路（问题域聚人）融合权重
# ══════════════════════════════════════════════════════════════════
history_recall:
  top_k: 5
  half_life_days: 90        # 半衰期90天：90天后经验仍保留 ~37%，半年后仍保留 ~14%
  sim_threshold: 0.3
  fault_code_boost: 0.15
  robot_type_boost: 0.10
  decay_weight: 0.5
  weight_a: 0.5             # A路（相似工单聚人）
  weight_b: 0.5             # B路（问题域聚人）

# ══════════════════════════════════════════════════════════════════
# 4. 职级惩罚系数
#    用途：职级越高越不优先接单，精排后按职级打折。
#    消费方：ranking/ranker.py
# ══════════════════════════════════════════════════════════════════
job_level_penalty:
  1: 1.0     # 一线：不打折
  2: 0.60    # 管理/审核：打 6 折
  3: 0.40    # 仅兜底：打 4 折
  99: 0.60   # 未知职级兜底值

# ══════════════════════════════════════════════════════════════════
# 5. 部门路由（Layer 1：R2 LLM + R3 历史 融合 + R-Audit 审查）
#    消费方：filtering/dept_router.py
#    策略：保证"不派错部门"——宁缺毋滥。仅当部门判定高置信才 hard_filter，
#          否则 no_filter 保留全量，把"选谁"交给后续精排 + LLM 决策。
#          R5 强关键词已移除（子串匹配易误触），部门判定统一由 R2 LLM + R3 历史融合。
#          融合后再做 R-Audit 部门派发审查（dept_audit_enabled=true 时）。
# ══════════════════════════════════════════════════════════════════
department_routing:
  weights:
    llm: 0.50
    history: 0.30
  thresholds:
    hard_filter_score: 0.88
    hard_filter_margin: 0.22
    soft_prior_score: 0.55
    dept_boost: 1.5
  llm:
    enabled: true
    max_tokens: 250
    temperature: 0
    min_confidence: 0.75
  history:
    enabled: true
    top_k: 10
    min_similarity: 0.70

# R-Audit 部门派发审查开关（true = R2 判完部门后独立 LLM 单轮复核）
dept_audit_enabled: true

departments:
  - id: robot_hardware
    name: 机器人事业部
    profile_text: |
      【负责】车体硬件、机械结构、电池/电机/底盘、货叉/升降等行走与执行机构故障。
      【不负责】调度系统、路径规划、SLAM/定位、服务号软件、地图编辑。
      【典型现象】无法开机、充不进电、轮子脱落/卡死、车体碰撞变形、货叉不动。
    examples:
      - title: "AGV左前轮脱落，车体底部碰撞变形"
        dept: 机器人事业部
      - title: "电池充不进电，开机无反应"
        dept: 机器人事业部

  - id: vehicle_software
    name: 智能移动研究院
    profile_text: |
      【负责】车载软件、SLAM/定位、激光雷达/传感器、控制器、网关通信、底层驱动。
      【不负责】车体机械硬件、调度任务下发、服务号平台、地图路网编辑。
      【典型现象】定位漂移、重定位失败、雷达无数据、传感器报错、控制无响应。
    examples:
      - title: "车辆定位漂移，显示位置与实际偏差大"
        dept: 智能移动研究院

  - id: dispatch_planning
    name: 智能规划研究院
    profile_text: |
      【负责】调度USP、任务调度/下发/阻塞、路径规划/避让/锁区、地图编辑、
              摇人吧服务号平台（前端/后端/AI/后台管理）。
      【不负责】车体机械、车载 SLAM/传感器驱动、纯硬件故障。
      【典型现象】任务无法下发、路径规划失败、地图保存失败、服务号功能异常。
    examples:
      - title: "调度任务一直处于阻塞状态，无法下发"
        dept: 智能规划研究院

# R5：仅 strong 关键词（medium/weak 已废弃）
