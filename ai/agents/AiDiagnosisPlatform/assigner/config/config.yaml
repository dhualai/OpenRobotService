# ══════════════════════════════════════════════════════════════════
# 6. 产品收紧（Layer 2）
#    消费方：filtering/product_router.py
# ══════════════════════════════════════════════════════════════════
product_routing:
  projects:
    - markers: ["摇人吧服务号"]
      product: 摇人吧服务号
  default_product: 调度USP
  default_when_project_set: true
  # users.responsibility_modules 中的 key 可能与 config 产品名不一致
  profile_keys:
    摇人吧服务号: ["摇人吧服务号", "服务号"]
    调度USP: ["调度USP"]
    车端软件: ["车端软件"]
    车端硬件: ["车端硬件"]

# ══════════════════════════════════════════════════════════════════
# 7. 置信度阈值（规则兜底决策用）
#    消费方：ranking/fallback_decision.py
#    auto ≥ 0.8 直接派单；recommend 0.5~0.8 建议确认；< 0.5 fallback
# ══════════════════════════════════════════════════════════════════
decision_thresholds:
  auto: 0.8
  recommend: 0.5

# ══════════════════════════════════════════════════════════════════
# 9. 负载均衡（对全体进入精排的候选人按在途工单数打折）
#    用途：按在途工单数对候选人精排分数打折（在途越多系数越低），
#          避免单子集中在少数人。对所有候选人统一施加；在途为 0 的人系数=1 不受影响。
#    消费方：pipeline/dispatch_flow.py
#    负载系数 = 1 / (1 + 在途数 × step)
#    说明：在途数查询有 30s 短 TTL 缓存，避免每次派单重复查库。
# ══════════════════════════════════════════════════════════════════
load_balance:
  enabled: true
  step: 0.15
