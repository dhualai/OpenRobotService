# ══════════════════════════════════════════════════════════════════
# 2. 模块锚文本（L2 语义召回用）
#    用途：每条锚文本代表一个责任模块，Embedding 比对"工单描述 vs 锚文本"，
#         命中模块后再按工程师 responsibility_modules 反查候选人。
#    消费方：recall/semantic_recall.py
# ══════════════════════════════════════════════════════════════════
module_anchor_texts:
  车端: "AGV/AMR车辆，MQTT通信，VDA5050协议适配，科钛科聪华睿海康自研，多品牌车端对接，车辆不动卡住不走停住原地旋转，XNA XQE XCD XS XPL XP3车型号"
  地图编辑: "路网地图编辑绘制，SLAM，背景图导入，地图预处理生成"
  路径规划: "MAPF多智能体路径规划，A*算法，交通规则管制，避让锁区，路径下发依赖，最短路径策略"
  任务调度: "任务分配与下发，流程编排，订单管理，即时动作执行，任务回调，上轨逻辑"
  外设: "输送线电梯自动门充电桩红绿灯门禁，外设通信对接与控制"
  仿真: "仿真模拟器，仿真车辆，任务模拟器"
  前端: "UI界面开发，2D/3D可视化渲染，微信H5页面，数据看板图表"
  数据: "数据统计分析报表，ETL，指标库，数据导出，数据质量校验"
  测试: "功能验证与自动化测试，版本回归测试，稳定性性能测试，Bug复现验证"
  算法: "强化学习，多智能体路径规划，AI地图生成辅助编辑，方案智能推荐，大语言模型AI辅助"
  定位: "车辆重定位，激光二维码惯导，反光板坐标，位置偏差，SLAM置信度"
  库位: "多层库位配置，载具货架识别，货叉堆垛取放货"
  网络: "WiFi通信，MQTT心跳ping，车辆在线离线状态监控"
  部署运维: "系统打包部署，版本管理，License授权，容器docker，环境配置，监控告警日志，在线更新"
  异常排查: "故障诊断，问题排查，Bug报错，错误码分析，告警处理"
  充电休息: "充电任务管理，充电桩通信，休息任务策略，充休电调度优化"
  交通管理: "锁区交通管制，多车避让，路径冲突管理，交通规则控制，调度策略"
  资源分配: "任务与资源分配，充电休息策略调度，上轨逻辑，A*规则路径优化"

# ══════════════════════════════════════════════════════════════════
# 3. 三路召回权重（L1 LLM / L2 语义 / L3 历史）
#    消费方：ranking/ranker.py
# ══════════════════════════════════════════════════════════════════
ranker_weights:
  llm_match: 0.70        # L1 纯LLM：LLM 看全员画像直接打分（权重最大，主导派单）
  semantic_match: 0.20   # L2 语义：Embedding 工单 → 模块锚文本 → 过滤工程师
  history_match: 0.10    # L3 历史：相似历史工单 → 按解决人聚合（数据积累中，暂低权重）

# ══════════════════════════════════════════════════════════════════
# 4. 职级惩罚系数
#    用途：职级越高越不优先接单，精排后按职级打折。
#    消费方：ranking/ranker.py
# ══════════════════════════════════════════════════════════════════
job_level_penalty:
  1: 1.0     # 一线：不打折
  2: 0.60    # 管理/审核：打 6 折
  3: 0.40    # 仅兜底：打 4 折
  99: 0.60   # 未知职级兜底值

