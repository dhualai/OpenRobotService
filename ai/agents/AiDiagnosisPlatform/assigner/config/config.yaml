# R1 确定性规则（预留，有 evidence 后扩展）
department_rules: {}

# ══════════════════════════════════════════════════════════════════
# 6. 产品收紧（Layer 2）
#    消费方：filtering/product_router.py
# ══════════════════════════════════════════════════════════════════
product_routing:
  projects:
    - markers: ["摇人吧服务号"]
      product: 摇人吧服务号
  default_product: 调度USP
  default_when_project_set: true
  # users.responsibility_modules 中的 key 可能与 config 产品名不一致
  profile_keys:
    摇人吧服务号: ["摇人吧服务号", "服务号"]
    调度USP: ["调度USP"]
    车端软件: ["车端软件"]
    车端硬件: ["车端硬件"]

# ══════════════════════════════════════════════════════════════════
# 7. 置信度阈值（规则兜底决策用）
#    消费方：ranking/fallback_decision.py
#    auto ≥ 0.8 直接派单；recommend 0.5~0.8 建议确认；< 0.5 fallback
# ══════════════════════════════════════════════════════════════════
decision_thresholds:
  auto: 0.8
  recommend: 0.5

# ══════════════════════════════════════════════════════════════════
# 9. 负载均衡（已移除，enabled=false）
#    背景：按在途工单数打折，会把"唯一该承接者"（如产品经理）压出决策窗口，
#          导致 feature 需求等本应派给专门角色的工单派错。已从派单流程中移除。
#    保留配置项仅为可逆标记，启用后 dispatch_flow._apply_load_balance 会重新生效。
#    消费方：pipeline/dispatch_flow.py
# ══════════════════════════════════════════════════════════════════
load_balance:
  enabled: false
  step: 0.15

# ══════════════════════════════════════════════════════════════════
# 10. LLM 综合决策的排名尊重策略（保证派单尊重精排结果）
#    消费方：ranking/llm_decision.py（Step 6）
#    规则：默认直接采用精排第一名，只有当第一名总分
#          < llm_decision_low_score_threshold（说明整体得分都很低、候选都不理想）时，
#          才触发大模型在精排 Top-K 内再决定一遍，避免大模型随意覆写排名。
#    - llm_decision_low_score_threshold：第一名评分阈值，低于此值才触发 LLM 重选（default 0.6）
#    - llm_decision_topk：即使触发 LLM 重选，也只在精排前 K 名内挑选（default 3）
#    - yaorenba_force_module_owner：摇人吧服务号项目是否强制优先模块总负责人（default true）
# ══════════════════════════════════════════════════════════════════
llm_decision_low_score_threshold: 0.6
llm_decision_topk: 3
yaorenba_force_module_owner: true

# ══════════════════════════════════════════════════════════════════
# 11. L2 锚文本语义召回开关
#    消费方：pipeline/dispatch_flow.py（Step 3）
#    说明：false = 停用 L2，派单只看 L1 LLM + L3 历史。
#          有 LLM 强语义判断后，锚文本/关键词匹配反而干扰（对产品经理等
#          "负责非功能模块"的候选人结构化不公平，易被表面字眼误导）。
#          置 true 可恢复 L2（需同时把 ranker_weights.semantic_match 调回 >0）。
# ══════════════════════════════════════════════════════════════════
semantic_recall_enabled: false
