# 智库（doc-service）API：独立 supervisor 进程。
#
# 设计要点：
# - **独立进程**，不挂进摇人吧后端（两套 settings / alembic / DB 引擎 / 加密封装不能混）；
# - 只绑 127.0.0.1:9420，不对公网暴露，流量统一从 mmp nginx 的 /t/app/kb/api/ 反代进来；
# - DATABASE_URL 指向本机独立 PG（127.0.0.1:5433，见 docker-compose.kb-test.yml）；
# - ORS_BASE_URL 指向摇人吧 test 后端（127.0.0.1:9400），账号统一校验走这一跳。
#
# 上线步骤（需 root 写配置目录）：
#   sudo cp test-open-robot-kb.conf /etc/supervisor/conf.d/
#   sudo sed -i 's/CHANGE_ME_xxx/真实值/g' /etc/supervisor/conf.d/test-open-robot-kb.conf
#   supervisorctl reread && supervisorctl update
#   supervisorctl status test-open-robot-kb
#
# 注意：写 /etc/supervisor/conf.d/ 需要 root；usp-a 只在 supervisor 组，
# 能免 sudo 使用 supervisorctl，但不能写配置目录——这一步必须运维配合。

[program:test-open-robot-kb]
command=/data/apps/TestOpenRobotService/kb-portal/server/.venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 9420
directory=/data/apps/TestOpenRobotService/kb-portal/server
user=usp-a
environment=PYTHONPATH="/data/apps/TestOpenRobotService/kb-portal/server",DATABASE_URL="postgresql+psycopg://topo:CHANGE_ME_pg@127.0.0.1:5433/topo",SESSION_SECRET="CHANGE_ME_32bytes_minimum",TOPO_CONTENT_KEY="CHANGE_ME_32bytes_minimum_content_key",ORS_BASE_URL="http://127.0.0.1:9400"
autostart=true
autorestart=true
startretries=3
stopsignal=TERM
stopwaitsecs=20
stdout_logfile=/data/apps/TestOpenRobotService/kb-portal/logs/supervisor.log
stderr_logfile=/data/apps/TestOpenRobotService/kb-portal/logs/supervisor.err.log
stdout_logfile_maxbytes=50MB
stderr_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile_backups=5
