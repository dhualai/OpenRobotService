# 智库（doc-service）作为摇人吧子页面：test 环境的 nginx location 片段。
#
# 目标形态（与摇人吧 test 同源，零 CORS）：
#   浏览器  https://usp.ep-zl.com/t/app/kb/        → 智库前端静态产物
#   浏览器  https://usp.ep-zl.com/t/app/kb/api/...  → 反代到本机 127.0.0.1:9420（supervisor 进程）
#
# 挂载方式：把下面两段**原样追加**到 /data/apps/mmp/nginx/conf/nginx.conf 中
# `server_name usp.ep-zl.com` 那个 server 块内（与 /t/app/、/t/api/ 并列），
# 然后 `nginx -t && nginx -s reload`（或重启 mmp nginx）。
#
# 两个必须注意的点：
# 1) 两处都用 `^~` 前缀匹配：该配置里有
#    `location ~* (\.env|\.config|\.json)$ { deny all; }` 这类正则 location，
#    正则优先于普通前缀 location，会让智库的 .json 请求被 403。
#    现有 `location ^~ /t/api/ai/` 就是为绕开它而写的，这里照做。
# 2) 前缀匹配按「最长匹配」生效，所以 /t/app/kb/api/ 仍然压过 /t/app/kb/，
#    两者都用 ^~ 也不会互相干扰。

    # ---- 智库 API：反代到本机独立进程 ----
    location ^~ /t/app/kb/api/ {
        proxy_pass http://127.0.0.1:9420/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 32m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---- 智库前端：静态产物 + SPA 路由回退 ----
    location ^~ /t/app/kb/ {
        alias /data/apps/TestOpenRobotService/nginx/html/test/kb/;
        index index.html;
        try_files $uri $uri/ /t/app/kb/index.html;
    }
