[pytest]
asyncio_mode = auto
testpaths = ai/tests
markers =
    unit: 纯逻辑测试，无外部依赖（LLM/Qdrant/Redis/MySQL 均 mock）
    integration: 需要本地 Qdrant 数据（QDRANT_LOCAL_PATH 必须设置）
    slow: 需要真实 LLM 调用（仅手动/CI 运行，默认跳过）
    api: API integration tests
    ui: UI automation tests
    ai: AI evaluation tests
    db: Database validation tests
    e2e: End-to-end workflow tests
    smoke: Smoke tests (fast lane)
    contract: OpenAPI contract tests (Schemathesis)
    flaky: Known flaky tests
    mock: Tests using mock services
    judge: Tests that invoke the LLM judge (L3, higher cost)
addopts = -ra --strict-markers