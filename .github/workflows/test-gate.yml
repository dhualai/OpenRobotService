# 测试主线：push 到 test 即跑完整自动化测试（只测不部署）
#
# 设计原理见 automation/docs/design-ci-pipeline-consolidation.md。
#   - 本流水线只做验证，不含 build/deploy/rollback；部署仍由 deploy-split 手动触发
#   - db-integration 从 db-tests.yml 复制（独立 job，保留非阻塞观察期语义）
#   - quality-gate / real-smoke / scenarios 从 deploy-split.yml 复制，去掉 plan 依赖与部署条件
#   - ui-smoke 不并入（环境重、失败隔离价值高），仍由 ui-smoke.yml 按前端路径独立触发
#   - 所有凭据用 secrets/vars 回落，不新增明文
name: Test Gate (push test)

on:
  push:
    branches: [test]
    paths:
      - "automation/**"
      - "backend/**"
      - "frontend/**"
      - "ai/**"
      - ".github/workflows/test-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ---------------- 1. workflow 结构自检 ----------------
  structure-guard:
    name: Workflow structure guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate workflow steps structure
        run: |
          pip install pyyaml -q
          python - <<'PY'
          import pathlib, sys
          import yaml
          errors = []
          for f in sorted(pathlib.Path('.github/workflows').glob('*.y*ml')):
              data = yaml.safe_load(f.read_text(encoding='utf-8'))
              for jname, job in (data.get('jobs') or {}).items():
                  for i, step in enumerate(job.get('steps') or []):
                      has_uses = 'uses' in step
                      has_run = 'run' in step
                      if has_uses == has_run:
                          errors.append(f'{f.name}:{jname}[{i}] step must have exactly one of uses/run')
          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print('All workflow steps have exactly one of uses/run')
          PY

  # ---------------- 2. 框架库 + API mock ----------------
  quality-gate:
    name: Automation quality gate
    needs: structure-guard
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: openrobot
        ports:
          - "3306:3306"
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      qdrant:
        image: qdrant/qdrant:v1.18.3
        ports:
          - "6333:6333"
          - "6334:6334"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -e automation/

      - name: Init test DB schema
        env:
          DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/openrobot
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          python -c "from app.core.db import engine; from app.models import Base; Base.metadata.create_all(engine)"

      - name: Run automation framework tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          AUTOMATION_ENV: local
        run: |
          pytest automation/config/tests/ automation/src/logger/tests/ automation/src/clients/tests/ automation/src/assertions/tests/ automation/src/fixtures/tests/ automation/src/ai_metrics/tests/ automation/src/runtime/tests/ automation/src/client/tests/ automation/src/contract/tests/ automation/src/remote/tests/ automation/src/ticket_pipeline/tests/ automation/src/reporting/tests/ automation/ci_ai_gen/tests/ automation/mcp_server/tests/ automation/tests/infrastructure/ automation/src/mocks/tests/ -q --alluredir=automation/output/allure-results --junitxml=automation/output/junit-quality-infra.xml

      - name: Run API mock tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest automation/tests/ -m api -q --alluredir=automation/output/allure-results --junitxml=automation/output/junit-quality-api.xml

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-quality
          path: automation/output/allure-results
          if-no-files-found: warn
          retention-days: 7

  # ---------------- 3. DB 集成（原 db-tests.yml，非阻塞观察期） ----------------
  db-integration:
    name: DB integration (knowledge)
    needs: structure-guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: "123456"
          MYSQL_DATABASE: helpdesk_test
        ports:
          - "3306:3306"
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -e automation/

      - name: Init test DB schema
        env:
          DATABASE_URL: mysql+pymysql://root:123456@127.0.0.1:3306/helpdesk_test
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          python -c "from app.core.db import engine; from app.models import Base; Base.metadata.create_all(engine)"

      - name: Run DB integration tests
        env:
          AUTOMATION_ENV: local
          AUTOMATION_DB_NAME: helpdesk_test
        run: |
          pytest automation/tests/ -m db -q \
            --alluredir=automation/output/allure-results-db \
            --junitxml=automation/output/junit-db.xml

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-db
          path: automation/output/allure-results-db
          if-no-files-found: warn
          retention-days: 7

  # ---------------- 4. 真实后端 smoke + 契约 ----------------
  real-smoke:
    name: Real backend smoke + contract
    needs: structure-guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/openrobot
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: openrobot
        ports:
          - "3306:3306"
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      qdrant:
        image: qdrant/qdrant:v1.18.3
        ports:
          - "6333:6333"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -e automation/

      - name: Init test DB schema
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          python -c "from app.core.db import engine; from app.models import Base; Base.metadata.create_all(engine)"

      - name: Start backend
        run: |
          cd backend
          nohup python -m uvicorn app:app --host 0.0.0.0 --port 8400 > backend.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8400/api/health >/dev/null 2>&1; then
              echo "backend healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "backend did not become healthy"
          cat backend.log
          exit 1

      - name: Run real backend smoke tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          AUTOMATION_ENV: local
          USE_MOCK: "0"
          REAL_API_BASE_URL: http://localhost:8400
          REAL_ADMIN_USERNAME: admin
          REAL_ADMIN_PASSWORD: ${{ secrets.REAL_ADMIN_PASSWORD || vars.REAL_ADMIN_PASSWORD || 'usp2026@EP' }}
        run: |
          pytest automation/tests/real -m smoke -q --alluredir=automation/output/allure-results --junitxml=automation/output/junit-real.xml

      - name: Run OpenAPI contract smoke
        env:
          PYTHONPATH: ${{ github.workspace }}
          AUTOMATION_ENV: local
          CONTRACT_TEST_ENABLED: "1"
          OPENAPI_SCHEMA_URL: http://localhost:8400/api/openapi.json
          OPENAPI_BASE_URL: http://localhost:8400
          CONTRACT_INCLUDE_PATH_REGEX: ^/api/health$
          CONTRACT_MAX_EXAMPLES: "5"
        run: |
          pytest automation/tests/contract -m contract -q --alluredir=automation/output/allure-results --junitxml=automation/output/junit-contract.xml

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-real-smoke
          path: automation/output/allure-results
          if-no-files-found: warn
          retention-days: 7

  # ---------------- 5. 业务场景（非阻断，沿用 ticket-gate 哲学） ----------------
  scenarios:
    name: Ticket functional cases
    needs: structure-guard
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    env:
      DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/openrobot
      SEED_PROJECT_ID: "Leo_test"
      SEED_PROJECT_NAME: "摇人吧服务号-测试"
      SEED_BOT_USERNAME: "automation_bot"
      SEED_PLAIN_USERNAME: "plain_user"
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: openrobot
        ports:
          - "3306:3306"
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      qdrant:
        image: qdrant/qdrant:v1.18.3
        ports:
          - "6333:6333"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -e automation/

      - name: Init test DB schema
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          python -c "from app.core.db import engine; from app.models import Base; Base.metadata.create_all(engine)"

      - name: Seed automation environment
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          SEED_BOT_PASSWORD: ${{ secrets.SEED_BOT_PASSWORD || vars.SEED_BOT_PASSWORD || 'Automation@2026' }}
          SEED_PLAIN_PASSWORD: ${{ secrets.SEED_PLAIN_PASSWORD || vars.SEED_PLAIN_PASSWORD || 'Passw0rd!' }}
        run: |
          python backend/scripts/seed_automation_env.py

      - name: Start backend
        run: |
          cd backend
          nohup python -m uvicorn app:app --host 0.0.0.0 --port 8400 > backend.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8400/api/health >/dev/null 2>&1; then
              echo "backend healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "backend did not become healthy"
          cat backend.log
          exit 1

      - name: Run real scenario tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          AUTOMATION_ENV: local
          USE_MOCK: "0"
          REAL_API_BASE_URL: http://localhost:8400
          REAL_U1_USERNAME: admin
          REAL_U1_PASSWORD: ${{ secrets.REAL_ADMIN_PASSWORD || vars.REAL_ADMIN_PASSWORD || 'usp2026@EP' }}
          REAL_U2_USERNAME: ${{ env.SEED_BOT_USERNAME }}
          REAL_U2_PASSWORD: ${{ secrets.SEED_BOT_PASSWORD || vars.SEED_BOT_PASSWORD || 'Automation@2026' }}
          REAL_U3_USERNAME: ${{ env.SEED_PLAIN_USERNAME }}
          REAL_U3_PASSWORD: ${{ secrets.SEED_PLAIN_PASSWORD || vars.SEED_PLAIN_PASSWORD || 'Passw0rd!' }}
        run: |
          pytest automation/tests/real/test_ticket_scenarios.py -q --alluredir=automation/output/allure-results-scenarios --junitxml=automation/output/junit-scenarios.xml

      - name: Upload scenario test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenario-test-results
          path: |
            automation/output/allure-results-scenarios
            automation/output/junit-scenarios.xml

  # ---------------- 6. Allure 汇总 ----------------
  allure-report:
    name: Allure report
    needs: [structure-guard, quality-gate, db-integration, real-smoke, scenarios]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # 发布到 gh-pages 分支需要写权限
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          merge-multiple: true
          path: automation/output/allure-results

      - name: Generate Allure HTML report
        continue-on-error: true
        uses: simple-elf/allure-report-action@v1.15
        with:
          allure_results: automation/output/allure-results
          allure_history: allure-history
          keep_reports: 20

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-html
          path: allure-history
          if-no-files-found: warn
          retention-days: 14

      - name: Publish report to gh-pages
        # 推到 gh-pages/test-gate 子目录，keep_files 保留 deploy-split 的根目录报告，
        # 两者互不覆盖。GitHub Pages 启用前该步骤只写分支、不产生可访问 URL。
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-history
          destination_dir: test-gate
          keep_files: true

      - name: Case-level summary from Allure results
        # 直接解析 Allure result JSON，把用例级统计写进 run 页面 Summary，
        # 无需下载 artifact 即可看到通过/失败数量与失败用例名。
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib, collections
          root = pathlib.Path('automation/output/allure-results')
          cnt = collections.Counter()
          bad = []
          if root.is_dir():
              for f in root.rglob('*-result.json'):
                  try:
                      d = json.loads(f.read_text(encoding='utf-8'))
                  except Exception:
                      continue
                  st = str(d.get('status') or 'unknown')
                  cnt[st] += 1
                  if st in ('failed', 'broken'):
                      bad.append((st, d.get('fullName') or d.get('name') or '?'))
          print('')
          print('### 用例统计（来自 Allure 结果）')
          print('')
          print(f'- 合计：{sum(cnt.values())}')
          for k in ('passed', 'failed', 'broken', 'skipped', 'unknown'):
              if cnt.get(k):
                  print(f'- {k}：{cnt[k]}')
          if bad:
              print('')
              print('### 失败用例')
              print('')
              for st, name in bad[:40]:
                  print(f'- `{name}`（{st}）')
              if len(bad) > 40:
                  print(f'- …另有 {len(bad) - 40} 条，见下方 Allure 报告')
          else:
              print('')
              print('无失败用例 ✓')
          PY

      - name: Job summary
        run: |
          echo "## Test gate results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| job | result |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| quality-gate | ${{ needs.quality-gate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| db-integration | ${{ needs.db-integration.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| real-smoke | ${{ needs.real-smoke.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| scenarios | ${{ needs.scenarios.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 报告在哪看" >> $GITHUB_STEP_SUMMARY
          echo "1. **概要**：本页面（上方用例统计与失败清单）" >> $GITHUB_STEP_SUMMARY
          echo "2. **详细报告**：本页底部 Artifacts → 下载 \`allure-report-html\` → 解压打开 \`latest/index.html\`" >> $GITHUB_STEP_SUMMARY
          echo "3. **在线地址**：已发布至 \`gh-pages\` 的 \`test-gate/\` 目录，仓库启用 GitHub Pages 后可直接访问" >> $GITHUB_STEP_SUMMARY
