# 测试主线：push 到 test 即跑完整自动化测试（只测不部署）
#
# 设计原理见 automation/docs/design-ci-pipeline-consolidation.md。
#   - 本流水线只做验证，不含 build/deploy/rollback；部署仍由 deploy-split 手动触发
#   - db-integration 从 db-tests.yml 复制（独立 job，保留非阻塞观察期语义）
#   - quality-gate / real-smoke / scenarios 从 deploy-split.yml 复制，去掉 plan 依赖与部署条件
#   - ui-smoke 不并入（环境重、失败隔离价值高），仍由 ui-smoke.yml 按前端路径独立触发
#   - 所有凭据用 secrets/vars 回落，不新增明文
name: Test Gate (push test)

on:
  push:
    branches: [test]
    paths:
      - "automation/**"
      - "backend/**"
      - "frontend/**"
      - "ai/**"
      - ".github/workflows/test-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ---------------- 1. workflow 结构自检 ----------------
  structure-guard:
    name: Workflow structure guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate workflow steps structure
        run: |
          pip install pyyaml -q
          python - <<'PY'
          import pathlib, sys
          import yaml
          errors = []
          for f in sorted(pathlib.Path('.github/workflows').glob('*.y*ml')):
              data = yaml.safe_load(f.read_text(encoding='utf-8'))
              for jname, job in (data.get('jobs') or {}).items():
                  for i, step in enumerate(job.get('steps') or []):
                      has_uses = 'uses' in step
                      has_run = 'run' in step
                      if has_uses == has_run:
                          errors.append(f'{f.name}:{jname}[{i}] step must have exactly one of uses/run')
          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print('All workflow steps have exactly one of uses/run')
          PY

  # ---------------- 2. 框架库 + API mock ----------------
  quality-gate:
    name: Automation quality gate
    needs: structure-guard
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: openrobot
        ports:
          - "3306:3306"
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      qdrant:
        image: qdrant/qdrant:v1.18.3
        ports:
          - "6333:6333"
          - "6334:6334"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -e automation/

      - name: Init test DB schema
        env:
          DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/openrobot
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          python -c "from app.core.db import engine; from app.models import Base; Base.metadata.create_all(engine)"

      - name: Run automation framework tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          AUTOMATION_ENV: local
        run: |
          pytest automation/config/tests/ automation/src/logger/tests/ automation/src/clients/tests/ automation/src/assertions/tests/ automation/src/fixtures/tests/ automation/src/ai_metrics/tests/ automation/src/runtime/tests/ automation/src/client/tests/ automation/src/contract/tests/ automation/src/remote/tests/ automation/src/ticket_pipeline/tests/ automation/src/reporting/tests/ automation/ci_ai_gen/tests/ automation/mcp_server/tests/ automation/tests/infrastructure/ automation/src/mocks/tests/ -q --alluredir=automation/output/allure-results/quality-infra --junitxml=automation/output/junit-quality-infra.xml

      # 三层口径见 automation/docs/task-test-gate-three-tier.md：
      # 主流程（-m flow）阻塞门禁；其余接口用例只进报告技术明细，不阻塞。
      - name: Run main-flow API tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest automation/tests/ -m flow -q --alluredir=automation/output/allure-results/quality-api --junitxml=automation/output/junit-quality-api.xml

      - name: Run remaining API tests (advisory)
        env:
          PYTHONPATH: ${{ github.workspace }}
        continue-on-error: true
        run: |
          pytest automation/tests/ -m "api and not flow" -q \
            --alluredir=automation/output/allure-results/quality-detail \
            --junitxml=automation/output/junit-quality-detail.xml

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-quality
          path: automation/output/allure-results
          if-no-files-found: warn
          retention-days: 7

      - name: Prepare required quality JUnit evidence
        if: always()
        run: |
          python3 -m automation.src.reporting.gate_junit \
            --input-dir automation/output --output-dir automation/output/safe-junit quality-infra quality-api

      - name: Upload required quality JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-junit-quality
          path: |
            automation/output/safe-junit/junit-quality-infra.xml
            automation/output/safe-junit/junit-quality-api.xml
          if-no-files-found: warn
          retention-days: 7

  # ---------------- 3. DB 集成（原 db-tests.yml，非阻塞观察期） ----------------
  db-integration:
    name: DB integration (knowledge)
    needs: structure-guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: "123456"
          MYSQL_DATABASE: helpdesk_test
        ports:
          - "3306:3306"
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -e automation/

      - name: Init test DB schema
        env:
          DATABASE_URL: mysql+pymysql://root:123456@127.0.0.1:3306/helpdesk_test
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          python -c "from app.core.db import engine; from app.models import Base; Base.metadata.create_all(engine)"

      - name: Run DB integration tests
        env:
          AUTOMATION_ENV: local
          AUTOMATION_DB_NAME: helpdesk_test
        run: |
          pytest automation/tests/ -m db -q \
            --alluredir=automation/output/allure-results-db \
            --junitxml=automation/output/junit-db.xml

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-db
          path: automation/output/allure-results-db
          if-no-files-found: warn
          retention-days: 7

  # ---------------- 4. 真实后端 smoke + 契约 ----------------
  real-smoke:
    name: Real backend smoke + contract
    needs: structure-guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/openrobot
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: openrobot
        ports:
          - "3306:3306"
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      qdrant:
        image: qdrant/qdrant:v1.18.3
        ports:
          - "6333:6333"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -e automation/

      - name: Init test DB schema
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          python -c "from app.core.db import engine; from app.models import Base; Base.metadata.create_all(engine)"

      - name: Start backend
        run: |
          cd backend
          nohup python -m uvicorn app:app --host 0.0.0.0 --port 8400 > backend.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8400/api/health >/dev/null 2>&1; then
              echo "backend healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "backend did not become healthy"
          cat backend.log
          exit 1

      - name: Run real backend smoke tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          AUTOMATION_ENV: local
          USE_MOCK: "0"
          REAL_API_BASE_URL: http://localhost:8400
          REAL_ADMIN_USERNAME: admin
          REAL_ADMIN_PASSWORD: ${{ secrets.REAL_ADMIN_PASSWORD || vars.REAL_ADMIN_PASSWORD || 'usp2026@EP' }}
        run: |
          pytest automation/tests/real -m smoke -q --alluredir=automation/output/allure-results/real --junitxml=automation/output/junit-real.xml

      - name: Run OpenAPI contract smoke
        env:
          PYTHONPATH: ${{ github.workspace }}
          AUTOMATION_ENV: local
          CONTRACT_TEST_ENABLED: "1"
          OPENAPI_SCHEMA_URL: http://localhost:8400/api/openapi.json
          OPENAPI_BASE_URL: http://localhost:8400
          CONTRACT_INCLUDE_PATH_REGEX: ^/api/health$
          CONTRACT_MAX_EXAMPLES: "5"
        run: |
          pytest automation/tests/contract -m contract -q --alluredir=automation/output/allure-results/contract --junitxml=automation/output/junit-contract.xml

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-real-smoke
          path: automation/output/allure-results
          if-no-files-found: warn
          retention-days: 7

      - name: Prepare required real backend JUnit evidence
        if: always()
        run: |
          python3 -m automation.src.reporting.gate_junit \
            --input-dir automation/output --output-dir automation/output/safe-junit real contract

      - name: Upload required real backend JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-junit-real
          path: |
            automation/output/safe-junit/junit-real.xml
            automation/output/safe-junit/junit-contract.xml
          if-no-files-found: warn
          retention-days: 7

  # ---------------- 5. 业务场景（非阻断，沿用 ticket-gate 哲学） ----------------
  scenarios:
    name: Ticket functional cases
    needs: structure-guard
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    env:
      DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/openrobot
      SEED_PROJECT_ID: "Leo_test"
      SEED_PROJECT_NAME: "摇人吧服务号-测试"
      SEED_BOT_USERNAME: "automation_bot"
      SEED_PLAIN_USERNAME: "plain_user"
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: openrobot
        ports:
          - "3306:3306"
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      qdrant:
        image: qdrant/qdrant:v1.18.3
        ports:
          - "6333:6333"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -e automation/

      - name: Init test DB schema
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          python -c "from app.core.db import engine; from app.models import Base; Base.metadata.create_all(engine)"

      - name: Seed automation environment
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          SEED_BOT_PASSWORD: ${{ secrets.SEED_BOT_PASSWORD || vars.SEED_BOT_PASSWORD || 'Automation@2026' }}
          SEED_PLAIN_PASSWORD: ${{ secrets.SEED_PLAIN_PASSWORD || vars.SEED_PLAIN_PASSWORD || 'Passw0rd!' }}
        run: |
          python backend/scripts/seed_automation_env.py

      - name: Start backend
        run: |
          cd backend
          nohup python -m uvicorn app:app --host 0.0.0.0 --port 8400 > backend.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8400/api/health >/dev/null 2>&1; then
              echo "backend healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "backend did not become healthy"
          cat backend.log
          exit 1

      - name: Run real scenario tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          AUTOMATION_ENV: local
          USE_MOCK: "0"
          REAL_API_BASE_URL: http://localhost:8400
          REAL_U1_USERNAME: admin
          REAL_U1_PASSWORD: ${{ secrets.REAL_ADMIN_PASSWORD || vars.REAL_ADMIN_PASSWORD || 'usp2026@EP' }}
          REAL_U2_USERNAME: ${{ env.SEED_BOT_USERNAME }}
          REAL_U2_PASSWORD: ${{ secrets.SEED_BOT_PASSWORD || vars.SEED_BOT_PASSWORD || 'Automation@2026' }}
          REAL_U3_USERNAME: ${{ env.SEED_PLAIN_USERNAME }}
          REAL_U3_PASSWORD: ${{ secrets.SEED_PLAIN_PASSWORD || vars.SEED_PLAIN_PASSWORD || 'Passw0rd!' }}
        run: |
          pytest automation/tests/real/test_ticket_scenarios.py -q --alluredir=automation/output/allure-results-scenarios --junitxml=automation/output/junit-scenarios.xml

      - name: Upload scenario Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-scenarios
          path: automation/output/allure-results-scenarios
          if-no-files-found: warn

      - name: Prepare scenario JUnit evidence
        if: always()
        run: |
          python3 -m automation.src.reporting.gate_junit \
            --input-dir automation/output --output-dir automation/output/safe-junit scenarios

      - name: Upload scenario JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenario-test-results
          path: automation/output/safe-junit/junit-scenarios.xml

  # ---------------- 6. Allure 汇总 ----------------
  allure-report:
    name: Allure report
    needs: [structure-guard, quality-gate, db-integration, real-smoke, scenarios]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # 发布到 gh-pages 分支需要写权限
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Allure artifacts by job
        uses: actions/download-artifact@v4
        if: always()
        continue-on-error: true
        with:
          pattern: allure-results-*
          merge-multiple: false
          path: automation/output/allure-artifacts

      - name: Download required JUnit artifacts
        uses: actions/download-artifact@v4
        if: always()
        continue-on-error: true
        with:
          pattern: gate-junit-*
          merge-multiple: true
          path: automation/output/gate-junit

      - name: Evaluate required suites
        id: gate-verdict
        if: always()
        continue-on-error: true
        env:
          QUALITY_JOB_RESULT: ${{ needs.quality-gate.result }}
          REAL_JOB_RESULT: ${{ needs.real-smoke.result }}
        run: |
          python3 automation/src/reporting/gate_verdict.py \
            --junit-dir automation/output/gate-junit \
            --allure-artifacts-dir automation/output/allure-artifacts \
            --quality-job "$QUALITY_JOB_RESULT" \
            --real-job "$REAL_JOB_RESULT"

      - name: Prepare Allure files for reports
        id: prepare-reports
        if: always()
        continue-on-error: true
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from automation.src.reporting.gate_verdict import merge_allure_artifacts

          merge_allure_artifacts(
              Path("automation/output/allure-artifacts"), Path("automation/output/allure-results")
          )
          PY

      - name: Generate Allure HTML report
        id: allure-html
        if: always()
        continue-on-error: true
        uses: simple-elf/allure-report-action@v1.15
        with:
          allure_results: automation/output/allure-results
          allure_history: allure-history
          keep_reports: 20

      - name: Upload Allure HTML report
        id: allure-upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-html
          path: allure-history
          if-no-files-found: warn
          retention-days: 14

      - name: Publish report to gh-pages
        # 推到 gh-pages/test-gate 子目录，keep_files 保留 deploy-split 的根目录报告，
        # 两者互不覆盖。GitHub Pages 启用前该步骤只写分支、不产生可访问 URL。
        id: publish-pages
        if: ${{ always() && steps.allure-html.outcome == 'success' }}
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-history
          destination_dir: test-gate
          keep_files: true

      - name: Case-level summary from Allure results
        # 直接解析 Allure result JSON，把用例级统计写进 run 页面 Summary，
        # 无需下载 artifact 即可看到通过/失败数量与失败用例名。
        # tee 让内容同时进入 step 日志，便于排查（否则 summary 内容在日志里看不到）。
        if: always()
        continue-on-error: true
        run: |
          python - <<'PY' 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          import json, pathlib, collections
          root = pathlib.Path('automation/output/allure-results')
          cnt = collections.Counter()
          bad = []
          if root.is_dir():
              for f in root.rglob('*-result.json'):
                  try:
                      d = json.loads(f.read_text(encoding='utf-8'))
                  except Exception:
                      continue
                  st = str(d.get('status') or 'unknown')
                  cnt[st] += 1
                  if st in ('failed', 'broken'):
                      bad.append((st, d.get('fullName') or d.get('name') or '?'))
          total = sum(cnt.values())
          print('')
          print('### 用例统计（来自 Allure 结果）')
          print('')
          print(f'- 合计：{total}')
          for k in ('passed', 'failed', 'broken', 'skipped', 'unknown'):
              if cnt.get(k):
                  print(f'- {k}：{cnt[k]}')
          if total == 0:
              print('')
              print('> ⚠️ 未解析到任何用例结果：可能是上游 job 未产出 Allure 文件，')
              print('> 或报告步骤自身失败（如外部 action 下载失败）。**不代表测试通过。**')
              print('> 请查看各测试 job 的日志确认。')
          elif bad:
              print('')
              print('### 失败用例')
              print('')
              for st, name in bad[:40]:
                  print(f'- `{name}`（{st}）')
              if len(bad) > 40:
                  print(f'- …另有 {len(bad) - 40} 条，见下方 Allure 报告')
          PY

      - name: Build standalone HTML report
        # Allure 报告靠 JS fetch 读取 data/*.json，file:// 打开会被浏览器 CORS 拦截而空白，
        # 必须起 http 服务。此步骤额外生成一份数据全内联的单文件 HTML，双击即可查看。
        id: standalone-html
        if: always()
        continue-on-error: true
        run: |
          python - <<'PY'
          import json, pathlib, collections, html

          root = pathlib.Path('automation/output/allure-results')
          cnt = collections.Counter()
          rows = []
          if root.is_dir():
              for f in sorted(root.rglob('*-result.json')):
                  try:
                      d = json.loads(f.read_text(encoding='utf-8'))
                  except Exception:
                      continue
                  st = str(d.get('status') or 'unknown')
                  cnt[st] += 1
                  full = d.get('fullName') or d.get('name') or f.stem
                  short = full.split('#')[-1] if '#' in full else full.split('.')[-1]
                  dur = max(0, int((d.get('stop') or 0) - (d.get('start') or 0)))
                  detail = ((d.get('statusDetails') or {}).get('message') or '').strip()
                  rows.append((st, short, full, dur, detail))

          total = sum(cnt.values())
          order = {'failed': 0, 'broken': 1, 'passed': 2, 'skipped': 3, 'unknown': 4}
          rows.sort(key=lambda r: (order.get(r[0], 9), r[2]))
          color = {'passed': '#1a7f37', 'failed': '#cf222e', 'broken': '#9a6700',
                   'skipped': '#6e7781', 'unknown': '#6e7781'}

          def esc(x):
              return html.escape(str(x), quote=True)

          out_parts = ['<!DOCTYPE html>',
                       '<html lang="zh-CN"><head><meta charset="utf-8"><title>测试报告</title>',
                       '<style>',
                       'body{font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;margin:0;padding:24px;color:#1f2328;background:#fff}',
                       'h1{font-size:20px;margin:0 0 4px}',
                       '.meta{color:#6e7781;font-size:12px;margin-bottom:16px}',
                       '.stats{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}',
                       '.card{border:1px solid #d1d9e0;border-radius:8px;padding:10px 16px;min-width:96px}',
                       '.card b{display:block;font-size:22px;line-height:1.3}',
                       '.card span{font-size:12px;color:#6e7781}',
                       'table{border-collapse:collapse;width:100%;font-size:13px}',
                       'th,td{text-align:left;padding:8px 10px;border-bottom:1px solid #eaeef2;vertical-align:top}',
                       'th{background:#f6f8fa}',
                       'td.st{white-space:nowrap;font-weight:600}',
                       'code{font-size:12px;color:#57606a;word-break:break-all}',
                       'tr:hover td{background:#f6f8fa}',
                       '</style></head><body>',
                       '<h1>测试报告</h1>',
                       f'<div class="meta">用例合计 {total} 条</div>',
                       '<div class="stats">']
          for k in ('passed', 'failed', 'broken', 'skipped', 'unknown'):
              if cnt.get(k):
                  out_parts.append(f'<div class="card"><b style="color:{color[k]}">{cnt[k]}</b><span>{k}</span></div>')
          out_parts.append('</div>')
          out_parts.append('<table><thead><tr><th>状态</th><th>用例</th><th>耗时</th><th>失败信息</th></tr></thead><tbody>')
          for st, short, full, dur, detail in rows:
              c = color.get(st, '#6e7781')
              detail_html = '<code>' + esc(detail) + '</code>' if detail else ''
              out_parts.append(
                  '<tr><td class="st" style="color:' + c + '">' + esc(st) + '</td>'
                  + '<td><div>' + esc(short) + '</div><code>' + esc(full) + '</code></td>'
                  + '<td>' + str(dur) + ' ms</td><td>' + detail_html + '</td></tr>')
          out_parts.append('</tbody></table></body></html>')

          out = pathlib.Path('automation/output/test-report.html')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text('\n'.join(out_parts), encoding='utf-8')
          print(f'standalone report: {out} ({out.stat().st_size} bytes, {total} cases)')
          PY

      - name: Upload standalone HTML report
        id: standalone-upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: test-report-standalone
          path: automation/output/test-report.html
          if-no-files-found: warn
          retention-days: 14

      - name: Build business report
        # 面向非技术读者的四层报告：模块 → 功能 → 场景 → 步骤（含入参/出参/断言）。
        # 脚本位于 automation/src/reporting/business_report.py，仅依赖标准库。
        id: business-html
        if: always()
        continue-on-error: true
        run: |
          python3 automation/src/reporting/business_report.py \
            --results automation/output/allure-results \
            --out automation/output/test-report-business.html

      - name: Upload business report
        id: business-upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: test-report-business
          path: automation/output/test-report-business.html
          if-no-files-found: warn
          retention-days: 14

      - name: Job summary
        if: always()
        continue-on-error: true
        env:
          REPORT_PREPARE: ${{ steps.prepare-reports.outcome }}
          ALLURE_HTML: ${{ steps.allure-html.outcome }}
          ALLURE_ARTIFACT: ${{ steps.allure-upload.outputs.artifact-id }}
          STANDALONE_HTML: ${{ steps.standalone-html.outcome }}
          STANDALONE_ARTIFACT: ${{ steps.standalone-upload.outputs.artifact-id }}
          BUSINESS_HTML: ${{ steps.business-html.outcome }}
          BUSINESS_ARTIFACT: ${{ steps.business-upload.outputs.artifact-id }}
          PAGES_PUBLISH: ${{ steps.publish-pages.outcome }}
        run: |
          artifact_status() {
            if [ -n "$1" ]; then printf '已上传'; else printf '未上传'; fi
          }
          {
            printf '\n### 测试作业\n\n| Job | 结果 |\n| --- | --- |\n'
            printf '| quality-gate | %s |\n' '${{ needs.quality-gate.result }}'
            printf '| real-smoke | %s |\n' '${{ needs.real-smoke.result }}'
            printf '| db-integration（观察） | %s |\n' '${{ needs.db-integration.result }}'
            printf '| scenarios（观察） | %s |\n' '${{ needs.scenarios.result }}'
            printf '\n### 报告状态\n\n| 步骤 | 结果 | 下载产物 |\n| --- | --- | --- |\n'
            printf '| 整理 Allure 文件 | %s | — |\n' "${REPORT_PREPARE:-skipped}"
            printf '| Allure HTML | %s | %s |\n' "${ALLURE_HTML:-skipped}" "$(artifact_status "$ALLURE_ARTIFACT")"
            printf '| 用例清单 HTML | %s | %s |\n' "${STANDALONE_HTML:-skipped}" "$(artifact_status "$STANDALONE_ARTIFACT")"
            printf '| 业务 HTML | %s | %s |\n' "${BUSINESS_HTML:-skipped}" "$(artifact_status "$BUSINESS_ARTIFACT")"
            printf '| Pages 发布 | %s | — |\n' "${PAGES_PUBLISH:-skipped}"
            printf '\n已上传的报告可在本次运行的 Artifacts 下载。\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce Test Gate verdict
        if: always()
        env:
          TEST_GATE_VERDICT: ${{ steps.gate-verdict.outputs.verdict }}
          VERDICT_OUTCOME: ${{ steps.gate-verdict.outcome }}
        run: |
          case "$TEST_GATE_VERDICT:$VERDICT_OUTCOME" in
            passed:success) exit 0 ;;
            failed:failure|unverified:failure) ;;
            *)
              printf '\n## Test Gate 判定：未验收\n\n判定步骤未生成有效结论，请查看 Evaluate required suites 的日志。\n' >> "$GITHUB_STEP_SUMMARY"
              ;;
          esac
          echo "::error::Test Gate 未通过，请查看必跑套件判定"
          exit 1
