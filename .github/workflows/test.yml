name: Test

on:
  push:
    branches: [hxg, develop, test]
  pull_request:
    branches: [develop, test]

env:
  PYTHON_VERSION: "3.11"

jobs:
  test-infra:
    name: Infrastructure tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: openrobot
        ports:
          - "3306:3306"
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      qdrant:
        image: qdrant/qdrant:v1.10
        ports:
          - "6333:6333"
          - "6334:6334"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -e automation/

      - name: Run infrastructure tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          AUTOMATION_ENV: local
        run: |
          pytest automation/config/tests/ automation/src/logger/tests/ automation/src/clients/tests/ automation/src/assertions/tests/ automation/src/fixtures/tests/ automation/src/ai_metrics/tests/ automation/src/runtime/tests/ automation/src/client/tests/ automation/src/contract/tests/ automation/src/remote/tests/ automation/src/ticket_pipeline/tests/ automation/src/reporting/tests/ automation/ci_ai_gen/tests/ automation/mcp_server/tests/ automation/tests/infrastructure/ -v --alluredir=automation/output/allure-results --junitxml=automation/output/junit-infra.xml

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-infra
          path: automation/output/allure-results

  test-api:
    name: API tests (mock)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -e automation/

      - name: Run API mock tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest automation/tests/ -m api -v --alluredir=automation/output/allure-results --junitxml=automation/output/junit-api.xml

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-api
          path: automation/output/allure-results

  test-ai:
    name: AI unit tests (non-blocking)
    runs-on: ubuntu-latest
    # 非阻断门禁：目的是让 AI 侧单测的通过情况在 PR 上显性化（此前从不运行）。
    # 它会拉起 qdrant-client / 数据库驱动等较重依赖，跑红也不挡合并，先观察一段时间再收紧。
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # 单独用 3.12：ai/requirements.txt 自身要求 Python >= 3.12
          # （numpy>=2.5.1 等没有 3.11 wheel，用 env.PYTHON_VERSION 会解析失败）。
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-test.txt
          # AI 侧依赖必须整套装上：用例 import 的 ai.core / ai.agents 链上就有
          # tenacity、httpx、openai、redis、qdrant-client 等模块级 import，
          # 少装一个就是收集期 ModuleNotFoundError，得不到任何有效信号。
          # 先装 CPU 版 torch，否则 pip 默认拉 CUDA 版（体积数 GB、白等几分钟）。
          # 做法与 docs/troubleshooting.md 5.2 一致。
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r ai/requirements.txt

      - name: Prepare AI env
        run: |
          if [ ! -f ai/.env ]; then
            cp ai/.env.example ai/.env
          fi

      - name: Run AI unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          AI_PLAN_EXECUTE: "1"
          HF_HUB_OFFLINE: "1"
        run: |
          pytest ai/tests ai/agents/AiTaskPlatform ai/agents/AiDiagnosisPlatform/assigner/tests ai/core -q -p no:cacheprovider --junitxml=ai-junit.xml

      - name: Upload AI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-junit
          path: ai-junit.xml

  test-real:
    name: Real backend smoke tests
    runs-on: ubuntu-latest
    needs: test-infra

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: openrobot
        ports:
          - "3306:3306"
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      qdrant:
        image: qdrant/qdrant:v1.10
        ports:
          - "6333:6333"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -e automation/

      - name: Run database migrations
        run: |
          cd backend && alembic upgrade head

      - name: Start backend
        run: |
          cd backend
          nohup python -m uvicorn app:app --host 0.0.0.0 --port 8400 > backend.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8400/api/health >/dev/null 2>&1; then
              echo "backend healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "backend did not become healthy"
          cat backend.log
          exit 1

      - name: Run real backend smoke tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          AUTOMATION_ENV: local
          USE_MOCK: "0"
          REAL_API_BASE_URL: http://localhost:8400
          REAL_ADMIN_USERNAME: admin
          REAL_ADMIN_PASSWORD: usp2026@EP
        run: |
          pytest automation/tests/real -m smoke -v --alluredir=automation/output/allure-results --junitxml=automation/output/junit-real.xml

      - name: Run OpenAPI contract smoke
        env:
          PYTHONPATH: ${{ github.workspace }}
          AUTOMATION_ENV: local
          CONTRACT_TEST_ENABLED: "1"
          OPENAPI_SCHEMA_URL: http://localhost:8400/api/openapi.json
          OPENAPI_BASE_URL: http://localhost:8400
          CONTRACT_INCLUDE_PATH_REGEX: ^/api/(health|auth/login)$
          CONTRACT_MAX_EXAMPLES: "5"
        run: |
          pytest automation/tests/contract -m contract -v --alluredir=automation/output/allure-results --junitxml=automation/output/junit-contract.xml

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-real
          path: automation/output/allure-results
  report:
    name: Allure report
    if: always()
    needs: [test-infra, test-api, test-real]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          merge-multiple: true
          path: automation/output/allure-results

      - name: Generate Allure report
        uses: simple-elf/allure-report-action@v1.7
        with:
          allure_results: automation/output/allure-results
          allure_history: allure-history
          keep_reports: 20

      - name: Deploy report to GitHub Pages
        if: github.ref == 'refs/heads/develop'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-history
