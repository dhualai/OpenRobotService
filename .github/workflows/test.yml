name: Test

on:
  push:
    branches: [hxg, develop, test]
  pull_request:
    branches: [develop, test]

env:
  PYTHON_VERSION: "3.11"

jobs:
  test-infra:
    name: Infrastructure tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: openrobot
        ports:
          - "3306:3306"
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      qdrant:
        image: qdrant/qdrant:v1.10
        ports:
          - "6333:6333"
          - "6334:6334"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -e automation/

      - name: Run infrastructure tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          AUTOMATION_ENV: local
        run: |
          pytest automation/config/tests/ automation/src/logger/tests/ automation/src/clients/tests/ automation/src/assertions/tests/ automation/src/fixtures/tests/ automation/src/ai_metrics/tests/ automation/ci_ai_gen/tests/ automation/tests/infrastructure/ -v --alluredir=automation/output/allure-results --junitxml=automation/output/junit-infra.xml

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-infra
          path: automation/output/allure-results

  test-api:
    name: API tests (mock)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -e automation/

      - name: Run API mock tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest automation/tests/ -m api -v --alluredir=automation/output/allure-results --junitxml=automation/output/junit-api.xml

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-api
          path: automation/output/allure-results

  test-real:
    name: Real backend smoke tests
    runs-on: ubuntu-latest
    needs: test-infra

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: openrobot
        ports:
          - "3306:3306"
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      qdrant:
        image: qdrant/qdrant:v1.10
        ports:
          - "6333:6333"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -e automation/

      - name: Run database migrations
        run: |
          cd backend && alembic upgrade head

      - name: Start backend
        run: |
          cd backend
          nohup python -m uvicorn app:app --host 0.0.0.0 --port 8400 > backend.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8400/api/health >/dev/null 2>&1; then
              echo "backend healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "backend did not become healthy"
          cat backend.log
          exit 1

      - name: Run real backend smoke tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          AUTOMATION_ENV: local
          USE_MOCK: "0"
          REAL_API_BASE_URL: http://localhost:8400
          REAL_ADMIN_USERNAME: admin
          REAL_ADMIN_PASSWORD: usp2026@EP
        run: |
          pytest automation/tests/real -m smoke -v --alluredir=automation/output/allure-results --junitxml=automation/output/junit-real.xml

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-real
          path: automation/output/allure-results
  report:
    name: Allure report
    if: always()
    needs: [test-infra, test-api, test-real]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          merge-multiple: true
          path: automation/output/allure-results

      - name: Generate Allure report
        uses: simple-elf/allure-report-action@v1.7
        with:
          allure_results: automation/output/allure-results
          allure_history: allure-history
          keep_reports: 20

      - name: Deploy report to GitHub Pages
        if: github.ref == 'refs/heads/develop'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-history
