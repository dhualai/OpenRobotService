name: Ticket Gate (test branch)

on:
  push:
    branches: [test]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  # CI 一次性 MySQL，与 services.mysql 对应。不设置时 alembic 会去连本地默认库
  # (root:123456@127.0.0.1:3306/helpdesk)，迁移直接失败。
  DATABASE_URL: "mysql+pymysql://root:root@127.0.0.1:3306/openrobot"
  SECRET_KEY: "ci-ticket-gate-secret-key"
  # 种子数据：生成用例跑真实后端，需要一个已知项目和已知账号
  SEED_PROJECT_ID: "Leo_test"
  SEED_PROJECT_NAME: "摇人吧服务号-测试"
  SEED_BOT_USERNAME: "automation_bot"
  SEED_BOT_PASSWORD: ${{ secrets.SEED_BOT_PASSWORD || vars.SEED_BOT_PASSWORD || 'Automation@2026' }}

jobs:
  ticket-gate:
    if: vars.TICKET_GATE_ENABLED == 'true'
    name: Ticket-specific + regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 40

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: openrobot
        ports:
          - "3306:3306"
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      qdrant:
        image: qdrant/qdrant:v1.10
        ports:
          - "6333:6333"
          - "6334:6334"

    steps:
      - uses: actions/checkout@v4
        with:
          # The gate reads the whole pushed commit range. A shallow checkout
          # cannot resolve github.event.before locally.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -e automation/

      - name: Run database migrations
        run: |
          cd backend && alembic upgrade head

      - name: Seed automation environment
        run: |
          python backend/scripts/seed_automation_env.py

      - name: Start backend
        run: |
          cd backend
          nohup python -m uvicorn app:app --host 0.0.0.0 --port 8400 > backend.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sSf http://localhost:8400/api/health > /dev/null 2>&1; then
              echo "Backend is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Backend failed to start"
          cat backend.log
          exit 1

      - name: Prepare SSH key
        env:
          PROD_TICKET_SSH_PRIVATE_KEY: ${{ secrets.PROD_TICKET_SSH_PRIVATE_KEY }}
          PROD_TICKET_SSH_HOST: ${{ secrets.PROD_TICKET_SSH_HOST }}
          PROD_TICKET_SSH_PORT: ${{ secrets.PROD_TICKET_SSH_PORT }}
          PROD_TICKET_SSH_USER: ${{ secrets.PROD_TICKET_SSH_USER }}
          PROD_TICKET_DB_PASSWORD: ${{ secrets.PROD_TICKET_DB_PASSWORD }}
        run: |
          if [ -z "$PROD_TICKET_SSH_PRIVATE_KEY" ] \
            || [ -z "$PROD_TICKET_SSH_HOST" ] \
            || [ -z "$PROD_TICKET_SSH_PORT" ] \
            || [ -z "$PROD_TICKET_SSH_USER" ] \
            || [ -z "$PROD_TICKET_DB_PASSWORD" ]; then
            echo "::warning::生产工单只读凭据未配置完整，工单状态不可读"
            echo "::warning::门禁按 fail-closed 处理：跳过功能用例，仅执行回归"
            echo "TICKET_STATUS_LOOKUP_DISABLED=1" >> "$GITHUB_ENV"
            exit 0
          fi
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$PROD_TICKET_SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/prod_ticket_key"
          chmod 600 "$HOME/.ssh/prod_ticket_key"
          echo "PROD_TICKET_SSH_KEY=$HOME/.ssh/prod_ticket_key" >> "$GITHUB_ENV"

      - name: Capture commit messages
        run: |
          before="${{ github.event.before }}"
          if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ]; then
            git log --pretty=%B "$before..${{ github.sha }}" > commit-message.txt
          else
            git log -1 --pretty=%B > commit-message.txt
          fi
          cat commit-message.txt

      - name: Run ticket gate
        env:
          PYTHONPATH: ${{ github.workspace }}
          AUTOMATION_ENV: ${{ vars.AUTOMATION_ENV || 'local' }}
          USE_MOCK: "0"
          TEST_BASE_URL: "http://localhost:8400"
          TEST_USERNAME: ${{ env.SEED_BOT_USERNAME }}
          TEST_PASSWORD: ${{ env.SEED_BOT_PASSWORD }}
          REAL_DB_ASSERTIONS: ${{ vars.REAL_DB_ASSERTIONS || '1' }}
          REAL_API_BASE_URL: "http://localhost:8400"
          REAL_U1_USERNAME: ${{ env.SEED_BOT_USERNAME }}
          REAL_U1_PASSWORD: ${{ env.SEED_BOT_PASSWORD }}
          REAL_U2_USERNAME: ${{ env.SEED_BOT_USERNAME }}
          REAL_U2_PASSWORD: ${{ env.SEED_BOT_PASSWORD }}
          PROD_TICKET_SSH_HOST: ${{ secrets.PROD_TICKET_SSH_HOST }}
          PROD_TICKET_SSH_PORT: ${{ secrets.PROD_TICKET_SSH_PORT }}
          PROD_TICKET_SSH_USER: ${{ secrets.PROD_TICKET_SSH_USER }}
          PROD_TICKET_DB_PASSWORD: ${{ secrets.PROD_TICKET_DB_PASSWORD }}
        run: |
          python automation/scripts/cli-ticket-gate.py \
            --message-file commit-message.txt \
            --regression tests/business_chain \
            --regression tests/tasks \
            --regression tests/call \
            --regression tests/admin \
            --regression tests/auth \
            --require-resolved \
            --env "$AUTOMATION_ENV"

      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ticket-gate-report
          if-no-files-found: ignore
          path: |
            automation/output/junit-ticket-gate-functional.xml
            automation/output/junit-ticket-gate-regression.xml
            automation/output/ticket-gate-notification.json
            automation/output/allure-results
