name: AI Review

# AI Review（ORS-1149）：PR 合并前的非阻塞智能检视。
#
# 触发器只用实测可靠的两类（踩坑史见文末）：
#   1) pull_request [opened/synchronize/reopened]：规则快筛自动跑（fork PR 也
#      能跑，但 fork 拿不到 secrets——快筛零依赖 secrets，结果以 check 形式
#      显示在 PR Checks；深度检视与评论需要写权限/secrets，fork PR 由哨兵代跑）；
#   2) push 到哨兵分支 ai-review-go：深度检视触发。commit message 里写
#      "ai-review PR#495" 即可点名检视任意 PR（fork/同仓通用）。
#      配套触发命令见 scripts/ai-review-go.md。
#
# 安全红线：
#   - PR 代码零检出、零执行（diff 全走 API 内存处理）；
#   - 检视脚本与规则从 base 快照检出，PR 无法篡改；
#   - LLM 密钥只走 secrets，日志不回显；失败也发「未完成」报告；
#   - 全流程不阻塞合并与部署。
#
# 踩坑史（为什么长这样）：
#   - pull_request_target：GitHub 2026-12 起封锁公共仓库（brownout 已预演）；
#   - labeled 触发：GitHub 对同 label 快速 add/remove/add 有事件去重，两次
#     实测重打标签零 run（事件入账但不派发）；
#   - workflow_run / workflow_dispatch / schedule / issue_comment：要求
#     workflow 文件存在于默认分支 main，而 main 被保护规则冻结。

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [ai-review-go]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  ai-review:
    name: AI Review
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: ai-review-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: false
    env:
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      AI_REVIEW_API_KEY: ${{ secrets.AI_REVIEW_API_KEY }}
      AI_REVIEW_BASE_URL: ${{ secrets.AI_REVIEW_BASE_URL }}
      AI_REVIEW_MODEL: ${{ vars.AI_REVIEW_MODEL }}
      # 推理模型建议配 low：压 reasoning token 消耗，避免 content 被 max_tokens 截空
      AI_REVIEW_REASONING_EFFORT: ${{ vars.AI_REVIEW_REASONING_EFFORT }}
      AI_REVIEW_FALLBACK_API_KEY: ${{ secrets.AI_REVIEW_FALLBACK_API_KEY }}
      AI_REVIEW_FALLBACK_BASE_URL: ${{ secrets.AI_REVIEW_FALLBACK_BASE_URL }}
      AI_REVIEW_FALLBACK_MODEL: ${{ vars.AI_REVIEW_FALLBACK_MODEL }}
    steps:
      # 解析检视对象：
      #   pull_request → PR 号与 base 由事件给出；快筛自动跑，
      #                  若 PR 带 ai-review 标签则升级为深度检视；
      #   push 哨兵   → 从 head commit message 解析 "ai-review PR#N"，
      #                  恒为深度检视（secrets 在此上下文完整可用）。
      - name: Resolve target
        id: tgt
        env:
          SHA: ${{ github.sha }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # 空提交（tree 未变）的 push 事件 head_commit 为 null，改用
            # github.sha（恒有值）主动查 commit message
            msg=$(gh api "repos/$REPO/git/commits/$SHA" --jq '.message')
            pr=$(printf '%s' "$msg" | grep -oE 'ai-review PR#[0-9]+' | grep -oE '[0-9]+' | head -1)
            if [ -z "$pr" ]; then
              echo "::warning::哨兵 commit 未包含 'ai-review PR#N'，跳过"
              echo "mode=skip" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "mode=deep" >> "$GITHUB_OUTPUT"
            echo "pr=$pr" >> "$GITHUB_OUTPUT"
            echo "base_ref=test" >> "$GITHUB_OUTPUT"
          else
            echo "mode=auto" >> "$GITHUB_OUTPUT"
            echo "pr=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
            echo "base_ref=${{ github.event.pull_request.base.ref }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve PR base sha
        id: base
        env:
          PR: ${{ steps.tgt.outputs.pr }}
        run: echo "sha=$(gh api "repos/$REPO/pulls/$PR" --jq '.base.sha')" >> "$GITHUB_OUTPUT"

      # 双 checkout：base-rules/ = base 快照（规则+知识库+执行脚本，PR 不可篡改）；
      # pr-code/ = base 分支检出（仅作 bootstrap 回退脚本源，不含 PR 代码）
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.base.outputs.sha }}
          path: base-rules
      - uses: actions/checkout@v4
        with:
          ref: refs/heads/${{ steps.tgt.outputs.base_ref }}
          path: pr-code

      - name: Resolve exec scripts dir
        id: edir
        run: |
          if [ -f base-rules/.github/ai-review/scripts/deep_review.py ]; then
            echo "dir=base-rules" >> "$GITHUB_OUTPUT"
          else
            echo "dir=pr-code" >> "$GITHUB_OUTPUT"
            echo "::warning::base 尚无 ai-review 脚本，回退使用 base 分支版本（bootstrap 窗口）"
          fi

      - name: Should run deep review?
        id: deep
        if: steps.tgt.outputs.mode == 'auto'
        env:
          PR: ${{ steps.tgt.outputs.pr }}
        run: |
          # 带 ai-review 标签的 PR，每次更新自动升级深度检视（fork PR 无
          # secrets，此分支自动退化为纯快筛——LLM 调用会因缺 key 跳过）
          n=$(gh api "repos/$REPO/issues/$PR/labels/ai-review" --jq '.name' 2>/dev/null || true)
          if [ "$n" = "ai-review" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      # ---------------- 规则快筛（pull_request 自动） ----------------
      - name: Run quick screen
        id: screen
        if: steps.tgt.outputs.mode == 'auto' && steps.deep.outputs.run != 'true'
        run: |
          python3 ${{ steps.edir.outputs.dir }}/.github/ai-review/scripts/quick_screen.py \
            --out-json quick.json --out-md quick.md || code=$?
          echo "exit_code=${code:-0}" >> "$GITHUB_OUTPUT"

      - name: Post blocker comment (quick)
        if: >-
          steps.tgt.outputs.mode == 'auto' &&
          steps.deep.outputs.run != 'true' &&
          steps.screen.outputs.exit_code == '10'
        continue-on-error: true
        env:
          PR: ${{ steps.tgt.outputs.pr }}
        run: |
          python3 ${{ steps.edir.outputs.dir }}/.github/ai-review/scripts/post_comment.py \
            --marker "ors-ai-review:quick" --file quick.md

      - name: Notify wecom (quick blocker only)
        if: >-
          steps.tgt.outputs.mode == 'auto' &&
          steps.deep.outputs.run != 'true' &&
          steps.screen.outputs.exit_code == '10'
        continue-on-error: true
        env:
          NOTIFY_WEBHOOKS: ${{ secrets.NOTIFY_WEBHOOKS }}
          PR: ${{ steps.tgt.outputs.pr }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          {
            echo "**AI 规则快筛发现高危项**"
            echo "PR #${PR}《${PR_TITLE}》命中确定性高危规则："
            python3 - <<'PY'
          import json
          data = json.load(open("quick.json", encoding="utf-8"))
          for it in (data.get("blockers") or [])[:4]:
              print(f"▪ [规则] {it['path']} {it['label']}")
          n = len(data.get("blockers") or [])
          if n > 4:
              print(f"▪ …共 {n} 项")
          PY
            echo "详情：https://github.com/${REPO}/pull/${PR}"
          } > wecom.md
          python3 ${{ steps.edir.outputs.dir }}/.github/ai-review/scripts/notify_wecom.py --file wecom.md

      # ---------------- 深度检视（哨兵 push 或带标签的 PR 更新） ----------------
      - name: Run deep review
        id: review
        if: >-
          steps.tgt.outputs.mode == 'deep' ||
          (steps.tgt.outputs.mode == 'auto' && steps.deep.outputs.run == 'true')
        env:
          PR_NUMBER: ${{ steps.tgt.outputs.pr }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          code=0
          python3 ${{ steps.edir.outputs.dir }}/.github/ai-review/scripts/deep_review.py \
            --rules-root base-rules/docs/ai-review \
            --out report.md --out-inline inline.json \
            --out-wecom wecom.md || code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

      - name: Post report comment
        if: >-
          steps.tgt.outputs.mode == 'deep' ||
          (steps.tgt.outputs.mode == 'auto' && steps.deep.outputs.run == 'true')
        continue-on-error: true
        env:
          PR_NUMBER: ${{ steps.tgt.outputs.pr }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 ${{ steps.edir.outputs.dir }}/.github/ai-review/scripts/post_comment.py \
            --marker "ors-ai-review:report" --file report.md \
            --inline inline.json --head-sha "$HEAD_SHA"

      - name: Notify wecom (deep blocker only)
        if: >-
          (steps.tgt.outputs.mode == 'deep' ||
           (steps.tgt.outputs.mode == 'auto' && steps.deep.outputs.run == 'true')) &&
          hashFiles('wecom.md') != ''
        continue-on-error: true
        env:
          NOTIFY_WEBHOOKS: ${{ secrets.NOTIFY_WEBHOOKS }}
        run: python3 ${{ steps.edir.outputs.dir }}/.github/ai-review/scripts/notify_wecom.py --file wecom.md


