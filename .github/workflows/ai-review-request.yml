name: AI Review Request

# AI Review 的轻量请求器（ORS-1149）：只负责把 PR 号/动作打包成 artifact，
# 由 ai-review.yml 通过 workflow_run 在主仓上下文完成真正的检视。
#
# 为什么拆成两个 workflow：GitHub 自 2026-12 起分批封锁公共仓库的
# pull_request_target（brownout 已于 11-09/11-16 预演），改用 workflow_run
# 模式（fork 安全的标准架构）：本 workflow 在 PR 上下文只做无敏感的
# artifact 上传，检视侧（ai-review.yml）在主仓上下文持完整 secrets 运行。
#
# 本文件永不含 secrets；PR 代码在本流程中零检出、零执行。

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: ai-review-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  request:
    name: Emit request
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Write request manifest
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          LABEL_NAME: ${{ github.event.label.name }}
        run: |
          cat > request.json <<EOF
          {
            "pr_number": ${{ github.event.pull_request.number }},
            "action": "${{ github.event.action }}",
            "label": "${LABEL_NAME}",
            "head_sha": "${{ github.event.pull_request.head.sha }}",
            "base_ref": "${{ github.event.pull_request.base.ref }}"
          }
          EOF
          cat request.json

      - uses: actions/upload-artifact@v4
        with:
          name: ai-review-request-${{ github.event.pull_request.number }}
          path: request.json
          retention-days: 1
