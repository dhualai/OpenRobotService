# =============================================================================
# OpenRobotService 测试用例模板
# 按此模板由 AI 生成 YAML → scripts/generate_cases.py 写入 Excel
# =============================================================================

# ---------- 字段说明（对应 Excel 列 + test_runner.py 读取逻辑）----------
# id:              字符串，模块前缀+3位序号，自动生成
# module:          call | tasks | admin | auth （= Excel sheet 名）
# method:          GET | POST | PUT | PATCH | DELETE
# path:            API 路径，如 /api/tasks
# auth:            "Y" | "N"  是否带 Authorization header
# role:            admin | engineer | customer （可选，默认 admin）
# payload:         请求体 JSON（GET/DELETE 时为 null）  ← 会被 json.loads 解析
# expected_status: 期望 HTTP 状态码
# expected_fields: 断言 JSON 响应中的字段键值对    ← 会被 json.loads 解析
# note:            辅助信息：覆盖类型 / 功能点 / 备注
# type:            扩展标记（当前未参与断言）

# ---------- YAML 编写规则 ----------
# 1. 每个用例是一个 `- field: value` 块
# 2. payload / expected_fields 使用 YAML 的行内 JSON 或块标量
# 3. 模块分文件或合并文件均可
# 4. id 留空则 generate_cases.py 自动填充

# ==================== 示例：auth 模块 ====================
# - id: AUTH-001
#   module: auth
#   method: POST
#   path: /auth/login
#   auth: "N"
#   payload: {"username": "testadmin", "password": "admin123"}
#   expected_status: 200
#   expected_fields: {"token_type": "bearer"}
#   note: "正常流程：登录成功"

