# SIT（系统集成测试）环境配置
api:
  base_url: "http://sit.openrobot.local:8000"
  timeout: 60

database:
  host: "sit-mysql.openrobot.local"
  port: 3306
  user: "sit_user"
  password: ""
  database: "openrobot_sit"

redis:
  host: "sit-redis.openrobot.local"
  port: 6379
  password: ""
  db: 1

qdrant:
  host: "sit-qdrant.openrobot.local"
  port: 6333

deepseek:
  base_url: "https://api.deepseek.com"
  model: "deepseek-chat"

wechat:
  token: "sit_token"
  encoding_aes_key: ""
  app_id: "wx_sit"

playwright:
  browser: "chromium"
  headless: true
