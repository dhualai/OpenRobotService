# UAT（用户验收测试）环境配置
api:
  base_url: "http://uat.openrobot.local:8000"
  timeout: 30

database:
  host: "uat-mysql.openrobot.local"
  port: 3306
  user: "uat_user"
  password: ""
  database: "openrobot_uat"

redis:
  host: "uat-redis.openrobot.local"
  port: 6379
  password: ""
  db: 2

qdrant:
  host: "uat-qdrant.openrobot.local"
  port: 6333

deepseek:
  base_url: "https://api.deepseek.com"
  model: "deepseek-chat"

wechat:
  token: "uat_token"
  encoding_aes_key: ""
  app_id: "wx_uat"

playwright:
  browser: "chromium"
  headless: true
