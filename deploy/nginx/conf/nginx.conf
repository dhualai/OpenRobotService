
worker_processes 1;
pid /data/apps/mmp/nginx/nginx1.pid;
events {
    worker_connections 1024;
}
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    client_body_temp_path /data/apps/mmp/nginx/body;
    fastcgi_temp_path /data/apps/mmp/nginx/fastcgi;
    proxy_temp_path /data/apps/mmp/nginx/proxy;
    scgi_temp_path /data/apps/mmp/nginx/scgi;
    uwsgi_temp_path /data/apps/mmp/nginx/uwsgi;
	# 安全配置：隐藏Nginx版本号
    server_tokens off;
	log_format main '$remote_addr - $remote_user [$time_local] "$request" '
					'$status $body_bytes_sent "$http_referer" '
					'"$http_user_agent" "$http_x_forwarded_for" '
					'"$request_time" "$upstream_response_time"';
    # 日志配置
    access_log /data/apps/mmp/nginx/logs/access1.log;
    error_log /data/apps/mmp/nginx/logs/error1.log warn;

    # WebSocket 升级映射：普通请求 Connection: close，WS 请求 Connection: upgrade
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

        map $http_user_agent $bad_bot {
    default 0;
    ~*(bot|crawler|spider|scanner|hacker|dirbuster|nikto|sqlmap) 1;
    ~*(nmap|nessus|metasploit|hydra|burp) 1;
	}

	# 拦截恶意请求
	map $request_uri $bad_request {
		default 0;
    		~^/minio/ 0;
    		~^/p/(app|api)/ 0;   # 放行生产前端静态资源与后端代理
    		~^/t/(app|api)/ 0;   # 放行测试前端静态资源与后端代理
		~*(\.\.|\.asp|\.aspx|\.jsp|\.php|/cgi-bin|/bin/|/cmd/) 1;
		~*(wp-admin|phpmyadmin|/admin|/administrator|\.git|\.svn) 1;
		~*(union.*select|select.*from|insert.*into|delete.*from) 1;
	}
    # 性能优化
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    
    # Gzip压缩
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
   
    # 增大请求体大小限制（建议设为比实际上传大小大的值）

    # 反向代理大文件上传优化
    # proxy_request_buffering off;
    # proxy_buffering off;
    proxy_buffer_size 16k;
    proxy_buffers 4 64k;
    proxy_busy_buffers_size 128k;
    proxy_hide_header X-Powered-By;
    # 上传超时配置
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    
    # 目录访问限制
    disable_symlinks on;
    autoindex off;
    
    # 安全配置：限制请求体大小
    client_max_body_size 50M;
    client_body_buffer_size 10M;
	
    upstream aas_api {
		server 127.0.0.1:8001;  #
	}
    upstream da_api {
		server 127.0.0.1:8002;  #
	}
    upstream wechat_api {
		server 127.0.0.1:8003;  #
	}
	upstream backend_api {
		server 127.0.0.1:8004;  #
	}
	upstream backend_test_api {
		server 127.0.0.1:8200;  # 测试后端服务
	}
	upstream fqa_api {
		server 127.0.0.1:8005;  #
	}
	upstream emqx_api {
		server 127.0.0.1:18083;  #
	}
    # MinIO S3 API (端口 9000)
	upstream minio_api {
		server 127.0.0.1:9000;
	}
	# MinIO Console (端口 9001)
	upstream minio_console {
		server 127.0.0.1:9001;
	}
	# Airflow服务
	upstream airflow_api {
		server localhost:8055;
	}

        upstream prod_backend {            # 生产 业务后端
            server 127.0.0.1:8400;
        }
        upstream prod_ai {                 # 生产 AI 服务
            server 127.0.0.1:8401;
        }
        upstream test_backend {            # 测试 业务后端
            server 127.0.0.1:8410;
        }
        upstream test_ai {                 # 测试 AI 服务
            server 127.0.0.1:8411;
        }


	server {
			server_name usp.ep-zl.com; # 请替换为您的域名

			# 这是HTTP-01验证所需的核心配置
			#location ^~ /.well-known/acme-challenge/ {
			#	root /data/apps/mmp/nginx/cen; # 请替换为您用于存放验证文件的实际目录
				# 例如，如果您使用Certbot的webroot模式，目录可能是 /var/www/certbot
			#	default_type "text/plain";
			#	try_files $uri =404;
			#}
		#location / {
		#	root /data/apps/mmp/ui-projects; # 文件存放的根目录，替换为你的目录
		#	index user_projects.html; # 设置默认访问的文件名，例如你的文件是demo.txt，这里可以改成demo.txt
			# 如果希望访问目录时直接返回特定文件，可以取消注释下一行
			# try_files $uri $uri/ =404;
		#}
	
		listen 443 ssl;
		ssl_certificate /data/apps/mmp/nginx/ssl/STAR_ep-zl_com_integrated.crt;
		ssl_certificate_key /data/apps/mmp/nginx/ssl/STAR_ep-zl_com.key;
		ssl_protocols TLSv1.2 TLSv1.3;
		ssl_prefer_server_ciphers on;
		ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
		ssl_session_cache shared:SSL:10m;
		ssl_session_timeout 10m;
	
	
			# 安全配置：安全响应头
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        #add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'";
        # 设为 110m：略高于前端 100MB 上限，留 multipart 开销余量，避免边界 413
        client_max_body_size 110m;
        #
        # 安全配置：防止目录遍历
        location ~* /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
        
        # 拦截恶意请求
        if ($bad_bot) {
            return 444;
        }
        
        # 拦截恶意请求
        if ($bad_request) {
            return 444;
        }
        
        # 安全配置：限制文件访问
        location ~* \.(php|py|pl|sh|cgi|ini|conf|sql|bak|tar|gz|zip|log)$ {
            deny all;
        }
        
		location = /wechat/HelpDesk/search-index.json {
            alias /data/apps/mmp/HelpDesk/search-index.json; # 指向实际文件路径
            allow all; # 明确允许访问
            expires 10m; # 可选：添加缓存，优化访问速度
        }

        # 安全配置：限制敏感文件访问（排除minio路径）
        location ~* ^/minio/.*\.(json|env|config)$ {
            proxy_pass http://minio_console;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location ~* (\.env|\.config|\.json)$ {
            deny all;
        }	
                
        # 禁止访问敏感文件
        location ~ /\.(?!well-known) {
            deny all;
        }

		location /MP_verify_mEo6veeDcAaVM5Ub.txt {
			alias /data/apps/mmp/nginx/MP_verify_mEo6veeDcAaVM5Ub.txt; # 需要指定完整路径

		}

		location /MP_verify_EEtitsFLTvrG01bx.txt {
                        alias /data/apps/mmp/nginx/MP_verify_EEtitsFLTvrG01bx.txt; # 需要指定完整路径
                }

                location /t/app/ {
        		alias /data/apps/OpenRobotService/nginx/html/test/;
        		index  index.html;
        		try_files $uri $uri/ /t/app/index.html;   # SPA 前端路由回退
    		}

    		location /p/app/ {
        		alias /data/apps/OpenRobotService/nginx/html/prod/;
        		index  index.html;
      		        try_files $uri $uri/ /p/app/index.html;
    		}

		location = /p/app/index.html {
    			alias /data/apps/OpenRobotService/nginx/html/prod/index.html;
    			add_header Cache-Control "no-cache, no-store, must-revalidate";
		}

                location /t/api/ai/ {
                        proxy_buffering  off;       # SSE 必需：不缓冲响应，token 立即下发
                        proxy_cache      off;
                        proxy_read_timeout 600s;    # 两次读操作间超时（流式持续有数据即不会断）；多文件+VLM+诊断链路长，放宽到 10 分钟
                        proxy_send_timeout 600s;
                        gzip             off;       # 防止 event-stream 被压缩
                        # 多文件上传：5×100MB + multipart 开销
                        client_max_body_size 550m;
                        client_body_timeout 600s;
                        proxy_pass http://test_ai/api/ai/;
                }

                # 业务后端：其余 /t/api/*
                location /t/api/ {
                        proxy_http_version 1.1;
                        proxy_set_header Upgrade $http_upgrade;
                        proxy_set_header Connection $connection_upgrade;
                        proxy_set_header Host $http_host;
                        proxy_set_header X-Real-IP $remote_addr;
                        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                        proxy_set_header X-Forwarded-Proto $scheme;
                        proxy_read_timeout 3600s;
                        proxy_pass http://test_backend/api/;
                }


    		# ============================ 生产环境 ============================

                location /p/api/ai/ {
                        proxy_buffering  off;
                        proxy_cache      off;
                        proxy_read_timeout 600s;
                        proxy_send_timeout 600s;
                        gzip             off;
                        # 多文件上传：5×100MB + multipart 开销
                        client_max_body_size 550m;
                        client_body_timeout 600s;
                        proxy_pass http://prod_ai/api/ai/;
                }

                location /p/api/ {
                        proxy_http_version 1.1;
                        proxy_set_header Upgrade $http_upgrade;
                        proxy_set_header Connection $connection_upgrade;
                        proxy_set_header Host $http_host;
                        proxy_set_header X-Real-IP $remote_addr;
                        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                        proxy_set_header X-Forwarded-Proto $scheme;
                        proxy_read_timeout 3600s;
                        proxy_pass http://prod_backend/api/;
                }

		location /wechat/projects {
			alias   /data/apps/mmp/ui-projects;
			try_files $uri $uri/ /index.html;
		}
		location /wechat/backend/operation-logs {
			alias   /data/apps/mmp/ui-backend;
			try_files $uri $uri/ /index.html;
		}
		location /wechat/backend/data-import {
			alias   /data/apps/mmp/ui-backend;
			try_files $uri $uri/ /index.html;
		}

		location /wechat/HelpDesk/ {  # 关键：以/结尾的前缀匹配，精准匹配所有/HelpDesk/打头的请求
			alias /data/apps/mmp/HelpDesk/;  # 关键：根目录映射，结尾必须带/（与location保持一致）
			try_files $uri $uri/ /HelpDesk/index.html;  # 适配静态文件+前端路由重定向
			# index index.html index.htm;  # 可选：指定默认索引页，增强兼容性
		}
		location /HelpDesk/ {  # 关键：以/结尾的前缀匹配，精准匹配所有/HelpDesk/打头的请求
			alias /data/apps/mmp/HelpDesk/;  # 关键：根目录映射，结尾必须带/（与location保持一致）
			#try_files $uri $uri/ /HelpDesk/index.html;  # 适配静态文件+前端路由重定向
			# index index.html index.htm;  # 可选：指定默认索引页，增强兼容性
		}
		location /assets/ {
			alias /data/apps/mmp/ui-projects/assets/;	
			try_files $uri $uri/ @backend_static;
                }
		location @backend_static {
			root /data/apps/mmp/ui-backend/;	
			try_files $uri $uri/ @oa_static;
                }
		location @oa_static{
			root /data/apps/mmp/HelpDesk/assets/;
			expires 30d;
                }

        location /uploads/ {
            alias /data/apps/mmp/uploads/;
            expires 30d;
            # 限制上传目录的访问
            location ~* /\. {
                deny all;
            }
        }
		location /wechat/download/suggestions.csv {
        # 指定具体的文件路径
			alias /data/apps/mmp/wx/suggestions.csv;
			
			# 设置下载文件名
			add_header Content-Disposition 'attachment; filename="suggestions.csv"';
			
			# CSV文件的MIME类型
			types {
				text/csv csv;
			}
			default_type text/csv;
			
			# 如果文件不存在，返回404
			if (!-f $request_filename) {
				return 404 "File not found";
			}
		}
        # 反向代理规则
        # wechat相关路径代理到8003端口
		# location /emqx/ {
		# 	proxy_pass http://emqx_api/;
		# 	proxy_http_version 1.1;
		# 	proxy_set_header Upgrade $http_upgrade;
		# 	proxy_set_header Connection "upgrade";
		# 	#proxy_set_header Host $host;
		# 	proxy_set_header Host $http_host;
		# 	proxy_set_header X-Real-IP $remote_addr;
		# 	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		# 	proxy_set_header X-Forwarded-Proto $scheme;
		# }
		location = /test-api {
			return 301 /test-api/;
		}
		
				
		location /api/wechat {
            proxy_pass http://wechat_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
		location /api/projects {
            proxy_pass http://da_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
		location /api/daily-reports {
            proxy_pass http://da_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /api/data {
            proxy_pass http://da_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
		location /api/export {
            proxy_pass http://da_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
		location /api/backend/notify {
            proxy_pass http://da_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
		location /api/backend {
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        # AAS相关路径代理到8001端口
        location /AAS {
            proxy_pass http://aas_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
			
        }
		        # api/data路径代理到8002端口
        location /api/FQA {
            proxy_pass http://fqa_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
                # MinIO Console (Web 管理界面)
        location /minio/ {
            proxy_pass http://minio_console/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host 127.0.0.1:9001;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # WebSocket 支持
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port $server_port;

            # 关键：调整Cookie路径和域名，解决认证失效问题
            proxy_cookie_path / /minio/;
            proxy_cookie_domain ~^(.*)$ $http_host;

            # 修改响应内容中的链接，添加/minio/前缀
            # 注意：只替换不以/minio/开头的路径，避免重复替换
            sub_filter 'href="/' 'href="/minio/';
            sub_filter 'src="/' 'src="/minio/';
            sub_filter 'url(/' 'url(/minio/';
            sub_filter_once off;
            sub_filter_types *;
        }
        
        # MinIO Console API (通过/minio/api/v1/访问)
        location /minio/api/v1/ {
            proxy_pass http://minio_console/api/v1/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # MinIO Console WebSocket (通过/minio/ws/访问)
        location /minio/ws/ {
            proxy_pass http://minio_console/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # MinIO S3 API (对象存储接口)
        location /minio-api/ {
            proxy_pass http://minio_api/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # 支持大文件上传
            client_max_body_size 1000M;
            client_body_timeout 300s;
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }
        # Airflow服务代理
        location /airflow/ {
            proxy_pass http://airflow_api/airflow/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # 支持WebSocket
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # 其他所有路径代理到8001端口
        # location / {
        #     proxy_pass http://aas_api;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        # }
        
        # 使用nginx默认错误页面
    }
}

