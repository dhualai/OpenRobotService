# Nginx配置文件 - 微信公众号后端服务

# 全局配置
#user  usp-a;
worker_processes 1;
pid /data/apps/mmp/nginx/nginx.pid;
events {
    worker_connections 1024;
}

# HTTP服务器配置
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
	# 安全配置：隐藏Nginx版本号
    server_tokens off;
	log_format main '$remote_addr - $remote_user [$time_local] "$request" '
					'$status $body_bytes_sent "$http_referer" '
					'"$http_user_agent" "$http_x_forwarded_for" '
					'"$request_time" "$upstream_response_time"';
    # 日志配置
    access_log /data/apps/mmp/nginx/logs/access.log;
    error_log /data/apps/mmp/nginx/logs/error.log warn;
    
    # 性能优化
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    
    # Gzip压缩
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
   
    # 增大请求体大小限制（建议设为比实际上传大小大的值）
    client_max_body_size 50M;
    client_body_buffer_size 10M;

    # 反向代理大文件上传优化
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;
    proxy_busy_buffers_size 8k;

    # 上传超时配置
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    upstream aas_api {
		server 127.0.0.1:8001;  #
	}
    upstream da_api {
		server 127.0.0.1:8002;  #
	}
	upstream fqa_api {
		server 127.0.0.1:8005;  #
	}

    upstream wechat_api {
		server 127.0.0.1:8003;  #
	}
	
	upstream emqx_api {
		server 127.0.0.1:18083;  #
	}
    # 微信公众号后端服务配置
    server {
        listen 8801;
		server_name _;  # 只能用IP访问
		
		# 安全配置：安全响应头
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        #add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'";
        #
        # 安全配置：防止目录遍历
        location ~* /\. {
            deny all;
            access_log off;
            log_not_found off;
        }		
        
        # 反向代理规则
        # wechat相关路径代理到8003端口
		location /emqx/ {
			proxy_pass http://emqx_api/;
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "upgrade";
			#proxy_set_header Host $host;
			proxy_set_header Host $http_host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}
				

        
        # AAS相关路径代理到8001端口
        location /AAS {
            proxy_pass http://aas_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
			
        }
        
        # 其他所有路径代理到8001端口
        location / {
            proxy_pass http://aas_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # 错误页面
        error_page 404 /404.html;
        location = /404.html {
            root /root/mpp/wechat/app/templates;
            internal;
        }
        
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /root/mpp/wechat/app/templates;
            internal;
        }
    }
}

