# =====================================================================
#  应用网关：nginx 仅监听 80，分发 测试/生产 两套环境（前端 + 后端）
# ---------------------------------------------------------------------
#  路由规则（环境前缀：t=测试，p=生产）：
#    /t/app/*  -> 测试环境前端（静态文件 / SPA）
#    /p/app/*  -> 生产环境前端（静态文件 / SPA）
#    /t/api/*  -> 测试环境后端
#    /p/api/*  -> 生产环境后端
#
#  后端二次分流（依据后端路由设计）：
#    .../api/ai/* -> AI 服务  ( qa / chat / memory ，含 SSE 流式 )
#    .../api/*    -> 业务后端  ( auth / admin / tasks / call / wechat )
#
#  路径改写：剥离环境前缀 /t 或 /p，后端按原始 /api/... 路由接收。
#    例: /t/api/ai/qa/ask  -> AI服务  /api/ai/qa/ask
#        /t/api/tasks      -> 业务后端 /api/tasks
#
#  说明：nginx 的前缀匹配为“最长匹配”，因此 /t/api/ai/ 会优先于 /t/api/ 命中，
#        天然实现 AI 服务与业务后端的分流，无需 rewrite。
# =====================================================================


# ----------------------------- 上游服务 -----------------------------
#  注意：server 地址需按实际部署修改（当前为占位值）：
#    - 后端运行在宿主机 (Docker Desktop on Windows)：host.docker.internal
#    - 后端为同一 Docker 网络中的容器：使用 服务名/容器名
#    - nginx 非容器直接部署：127.0.0.1
upstream prod_backend {            # 生产 业务后端
    server host.docker.internal:8400;
}
upstream prod_ai {                 # 生产 AI 服务
    server host.docker.internal:8401;
}
upstream test_backend {            # 测试 业务后端
    server host.docker.internal:8410
}
upstream test_ai {                 # 测试 AI 服务
    server host.docker.internal:8411
}


server {
    listen 80;
    server_name _;

    # 后端含附件上传（AI /upload、任务评论附件等），放宽请求体上限
    client_max_body_size 100m;

    # ---- 后端代理共用请求头 ----
    #     location 内若不新增 proxy_set_header，则自动继承此处设置。
    #     （AI 流式 location 只调整 buffering/超时，不新增 proxy_set_header，
    #      因此不会触发 nginx 的“header 不继承”陷阱。）
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;


    # ============================ 测试环境 ============================

    # AI 生成的媒体文件（图片等），代理到 AI 服务
    location /t/api/media/ {
        proxy_pass http://test_ai/api/media/;
    }

    # AI 服务：含 SSE 流式（/stream 接口），必须关闭缓冲并放宽超时
    location /t/api/ai/ {
        proxy_buffering  off;       # SSE 必需：不缓冲响应，token 立即下发
        proxy_cache      off;
        proxy_read_timeout 300s;    # 两次读操作间超时（流式持续有数据即不会断）
        proxy_send_timeout 300s;
        gzip             off;       # 防止 event-stream 被压缩
        proxy_pass http://test_ai/api/ai/;
    }

    # 业务后端：其余 /t/api/*
    location /t/api/ {
        proxy_pass http://test_backend/api/;
    }


    # ============================ 生产环境 ============================

    location /p/api/media/ {
        proxy_pass http://prod_ai/api/media/;
    }

    location /p/api/ai/ {
        proxy_buffering  off;
        proxy_cache      off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        gzip             off;
        proxy_pass http://prod_ai/api/ai/;
    }

    location /p/api/ {
        proxy_pass http://prod_backend/api/;
    }

    # 裸 /api/media/（Markdown 中的图片不携带环境前缀 t/ p/）
    location /api/media/ {
        proxy_pass http://prod_ai/api/media/;
    }


    # ======================= 前端静态资源 (SPA) =======================
    #  注意：前端构建时必须设置对应的 base 路径，否则 index.html 内的
    #        资源引用 (/assets/...) 将无法命中：
    #        Vite:  base = '/t/app/'   (测试)   |   base = '/p/app/'   (生产)
    #        构建产物分别放入 html/test/ 与 html/prod/。

    location /t/app/ {
        alias /usr/share/nginx/html/test/;
        index  index.html;
        try_files $uri $uri/ /t/app/index.html;   # SPA 前端路由回退
    }

    location /p/app/ {
        alias /usr/share/nginx/html/prod/;
        index  index.html;
        try_files $uri $uri/ /p/app/index.html;
    }

    # 微信域名归属校验文件放行（网页授权域名 / JS-SDK 安全域名）
    #   公众号后台下载 MP_verify_xxxx.txt，放到容器 html/verify/ 目录即可公网访问
    location ~ ^/MP_verify_.*\.txt$ {
        root /usr/share/nginx/html/verify;
    }


    # ============================== 其它 ==============================

    # nginx 自身健康检查
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # 兜底：未匹配到任何路由
    location / {
        return 404;
    }
}
