worker_processes 1;
pid /data/apps/mmp/nginx/nginx1.pid;
events {
    worker_connections 1024;
}
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
	# 安全配置：隐藏Nginx版本号
    server_tokens off;
	log_format main '$remote_addr - $remote_user [$time_local] "$request" '
					'$status $body_bytes_sent "$http_referer" '
					'"$http_user_agent" "$http_x_forwarded_for" '
					'"$request_time" "$upstream_response_time"';
    # 日志配置
    access_log /data/apps/mmp/nginx/logs/access1.log;
    error_log /data/apps/mmp/nginx/logs/error1.log warn;
    
    # 性能优化
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    
    # Gzip压缩
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
   
    # 增大请求体大小限制（建议设为比实际上传大小大的值）
    client_max_body_size 50M;
    client_body_buffer_size 10M;

    # 反向代理大文件上传优化
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;
    proxy_busy_buffers_size 8k;

    # 上传超时配置
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

	server {
		listen 443 ssl; # 监听443端口并启用SSL
		server_name usp.ep-zl.com; # 替换为你的域名或IP地址，测试可用_localhost_

		# SSL证书和密钥的路径（替换为你的实际路径）
		ssl_certificate /data/apps/mmp/nginx/ssl/usp.ep-zl.com.crt;
		ssl_certificate_key /data/apps/mmp/nginx/ssl/usp.ep-zl.com.key;

		# SSL基础配置（增强安全性）
		ssl_protocols TLSv1.2 TLSv1.3; # 使用较新的TLS协议版本
		ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE:ECDH:AES:HIGH:!aNULL:!MD5:!RC4:!DHE;
		ssl_prefer_server_ciphers on;
		ssl_session_cache shared:SSL:10m;
		ssl_session_timeout 10m;

		# 配置你的文件服务
		location / {
			root /data/apps/mmp/ui-projects; # 文件存放的根目录，替换为你的目录
			index user_projects.html; # 设置默认访问的文件名，例如你的文件是demo.txt，这里可以改成demo.txt
			# 如果希望访问目录时直接返回特定文件，可以取消注释下一行
			# try_files $uri $uri/ =404;
		}
	}
}
